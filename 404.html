<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found – Vijigishu</title>
  <meta name="description" content="The page you are looking for doesn't exist or has been moved. Return to Vijigishu Educational Travel homepage." />
  <link rel="canonical" href="https://vijigishu.co.in/404.html" />
  <link rel="icon" type="image/png" href="images/admin-profile-icon.png" />
  <link rel="shortcut icon" href="images/admin-profile-icon.png" />
  <link rel="apple-touch-icon" href="images/admin-profile-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;0,800;1,700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy:  #1B1C4A;
      --green: #38673A;
      --sage:  #9FC28C;
      --gold:  #D4A840;
      --white: #FFFFFF;
      --off:   #F8F9FA;
      --gray:  #6E6E82;
      --dark:  #0D0E2E;
      --ease:  cubic-bezier(.25,.46,.45,.94);
    }
    html, body {
      min-height: 100vh;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--navy);
      background: radial-gradient(circle at 50% 0%, rgba(159, 194, 140, 0.22) 0%, transparent 60%),
                  radial-gradient(circle at 20% 30%, rgba(56, 103, 58, 0.08) 0%, transparent 50%),
                  radial-gradient(circle at 80% 30%, rgba(212, 168, 64, 0.1) 0%, transparent 50%),
                  #F9FAFC;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow-x: hidden;
    }
    a { text-decoration: none; color: inherit; }

    /* Top Centered Brand Logo */
    .top-header {
      width: 100%;
      padding: 36px 24px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }
    .brand-logo img {
      height: 52px;
      width: auto;
      object-fit: contain;
      transition: transform 0.3s var(--ease);
    }
    .brand-logo:hover img {
      transform: scale(1.05);
    }

    /* Centered Text Section */
    .error-content {
      max-width: 760px;
      width: 100%;
      text-align: center;
      padding: 10px 24px 0;
      z-index: 5;
    }

    .code-404 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(5.5rem, 11vw, 8.5rem);
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -3px;
      margin-bottom: 12px;
      background: linear-gradient(135deg, var(--navy) 0%, var(--green) 50%, var(--gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
      animation: float404 4.5s ease-in-out infinite alternate;
    }

    @keyframes float404 {
      0% {
        transform: translateY(0) scale(1);
        filter: drop-shadow(0 4px 12px rgba(56, 103, 58, 0.15));
      }
      100% {
        transform: translateY(-8px) scale(1.02);
        filter: drop-shadow(0 12px 24px rgba(212, 168, 64, 0.25));
      }
    }

    .error-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 4vw, 2.8rem);
      color: var(--navy);
      margin-bottom: 14px;
      line-height: 1.2;
    }
    .error-title span {
      color: var(--green);
      font-style: italic;
    }

    .error-desc {
      color: var(--gray);
      font-size: 1.1rem;
      line-height: 1.65;
      margin: 0 auto 32px;
      max-width: 580px;
    }

    .btn-group {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 16px 36px;
      border-radius: 100px;
      font-weight: 700;
      font-size: 0.95rem;
      transition: all 0.3s var(--ease);
      cursor: pointer;
      border: none;
      font-family: inherit;
    }
    .btn-primary {
      background: var(--navy);
      color: var(--white);
      box-shadow: 0 10px 26px rgba(27, 28, 74, 0.2);
    }
    .btn-primary:hover {
      background: var(--green);
      transform: translateY(-3px);
      box-shadow: 0 14px 34px rgba(56, 103, 58, 0.3);
    }
    .btn-outline {
      background: rgba(255, 255, 255, 0.85);
      color: var(--navy);
      border: 1.5px solid rgba(27, 28, 74, 0.2);
      backdrop-filter: blur(8px);
    }
    .btn-outline:hover {
      border-color: var(--navy);
      background: var(--white);
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.06);
    }

    /* Wide Fullscreen Mascot Section with Wires Edge-to-Edge */
    .mascot-wide-wrapper {
      width: 100vw;
      max-width: 100%;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      overflow: hidden;
      margin-top: 10px;
    }

    .mascot-ambient-glow {
      position: absolute;
      bottom: 20%;
      left: 50%;
      transform: translateX(-50%);
      width: 400px;
      height: 250px;
      background: radial-gradient(circle, rgba(212, 168, 64, 0.3) 0%, rgba(159, 194, 140, 0.2) 45%, transparent 70%);
      border-radius: 50%;
      z-index: 1;
      pointer-events: none;
      animation: pulseGlow 4s ease-in-out infinite alternate;
    }

    .mascot-wide-img {
      width: 100vw;
      max-width: 1350px;
      min-width: 900px;
      height: auto;
      display: block;
      object-fit: contain;
      position: relative;
      z-index: 2;
      animation: gentleBob 5s ease-in-out infinite;
      filter: drop-shadow(0 20px 35px rgba(27, 28, 74, 0.08));
    }

    @keyframes gentleBob {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-8px);
      }
    }

    @keyframes pulseGlow {
      0% { transform: translateX(-50%) scale(0.9); opacity: 0.7; }
      100% { transform: translateX(-50%) scale(1.18); opacity: 1; }
    }

    /* Minimal Bottom Copyright */
    .bottom-bar {
      width: 100%;
      text-align: center;
      padding: 16px 20px;
      font-size: 0.85rem;
      color: var(--gray);
      background: #F9FAFC;
      z-index: 10;
    }

    @media (max-width: 768px) {
      .top-header {
        padding: 24px 20px 10px;
      }
      .brand-logo img {
        height: 42px;
      }
      .code-404 {
        font-size: 4.8rem;
      }
      .error-title {
        font-size: 1.8rem;
      }
      .error-desc {
        font-size: 0.98rem;
        margin-bottom: 24px;
      }
      .btn {
        padding: 14px 28px;
        font-size: 0.9rem;
      }
      .mascot-wide-img {
        min-width: 100%;
        max-width: 100vw;
      }
    }
  </style>
</head>
<body>

  <!-- Top Centered Brand Header -->
  <header class="top-header">
    <a href="index.html" class="brand-logo" aria-label="Vijigishu Home">
      <img src="images/logo-of-vijigishu_2-1.webp" alt="Vijigishu Educational Travel" />
    </a>
  </header>

  <!-- Centered Content Section -->
  <section class="error-content">
    <div class="code-404">404</div>
    <h1 class="error-title">Oops! Looks like the <span>Connection is Lost</span></h1>
    <p class="error-desc">We couldn't connect you to the page you were looking for. The link might be broken, outdated, or disconnected.</p>
    
    <div class="btn-group">
      <a href="index.html" class="btn btn-primary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        Back to Home
      </a>
      <a href="immersion-programs.html" class="btn btn-outline">
        Explore Programs →
      </a>
    </div>
  </section>

  <!-- Fullscreen Edge-to-Edge Wire Mascot Section -->
  <div class="mascot-wide-wrapper">
    <div class="mascot-ambient-glow"></div>
    <img src="images/404-mascot-wide.png" alt="Lost Connection Lion Mascot" class="mascot-wide-img" />
  </div>

  <!-- Minimal Footer -->
  <footer class="bottom-bar">
    © <span class="year"></span> Vijigishu Education Pvt. Ltd. All rights reserved.
  </footer>

  <script>
    document.querySelector('.year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
