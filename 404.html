<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found – Vijigishu</title>
  <meta name="description" content="The page you are looking for doesn't exist or has been moved. Return to Vijigishu Educational Travel homepage." />
  <link rel="canonical" href="https://vijigishu.co.in/404.html" />
  <link rel="icon" type="image/png" href="images/admin-profile-icon.png" />
  <link rel="shortcut icon" href="images/admin-profile-icon.png" />
  <link rel="apple-touch-icon" href="images/admin-profile-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;0,800;1,700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy:  #1B1C4A;
      --green: #38673A;
      --sage:  #9FC28C;
      --gold:  #D4A840;
      --white: #FFFFFF;
      --off:   #F6F7F2;
      --gray:  #6E6E82;
      --dark:  #0D0E2E;
      --ease:  cubic-bezier(.25,.46,.45,.94);
    }
    html, body {
      min-height: 100vh;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--navy);
      background: radial-gradient(circle at 75% 40%, rgba(159, 194, 140, 0.28) 0%, transparent 55%),
                  radial-gradient(circle at 15% 75%, rgba(56, 103, 58, 0.12) 0%, transparent 45%),
                  radial-gradient(circle at 85% 85%, rgba(212, 168, 64, 0.1) 0%, transparent 40%),
                  var(--off);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-x: hidden;
    }
    a { text-decoration: none; color: inherit; }

    /* Minimal Top Brand Bar */
    .top-header {
      padding: 28px 40px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      z-index: 10;
    }
    .brand-logo img {
      height: 48px;
      width: auto;
      object-fit: contain;
      transition: transform 0.3s var(--ease);
    }
    .brand-logo:hover img {
      transform: scale(1.04);
    }

    /* Main Error Viewport */
    .error-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 32px 40px;
    }

    .error-container {
      max-width: 1100px;
      width: 100%;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      align-items: center;
      gap: 60px;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1.5px solid rgba(255, 255, 255, 0.95);
      border-radius: 36px;
      box-shadow: 0 24px 70px rgba(27, 28, 74, 0.08), inset 0 1px 2px rgba(255, 255, 255, 1);
      padding: 60px 54px;
      position: relative;
    }

    /* Left Content Column */
    .content-col {
      text-align: left;
      z-index: 2;
    }

    .code-404 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(5.5rem, 10vw, 8.5rem);
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -3px;
      margin-bottom: 16px;
      background: linear-gradient(135deg, var(--navy) 0%, var(--green) 50%, var(--gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
      animation: floatCode 4.5s ease-in-out infinite alternate;
    }

    @keyframes floatCode {
      0% {
        transform: translateY(0) scale(1);
        filter: drop-shadow(0 4px 10px rgba(56, 103, 58, 0.15));
      }
      100% {
        transform: translateY(-8px) scale(1.02);
        filter: drop-shadow(0 12px 24px rgba(212, 168, 64, 0.28));
      }
    }

    .error-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 3.5vw, 2.6rem);
      color: var(--navy);
      margin-bottom: 16px;
      line-height: 1.2;
    }
    .error-title span {
      color: var(--green);
      font-style: italic;
    }

    .error-desc {
      color: var(--gray);
      font-size: 1.1rem;
      line-height: 1.7;
      margin-bottom: 36px;
      max-width: 520px;
    }

    .btn-group {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 16px 34px;
      border-radius: 100px;
      font-weight: 700;
      font-size: 0.95rem;
      transition: all 0.3s var(--ease);
      cursor: pointer;
      border: none;
      font-family: inherit;
    }
    .btn-primary {
      background: var(--navy);
      color: var(--white);
      box-shadow: 0 10px 24px rgba(27, 28, 74, 0.18);
    }
    .btn-primary:hover {
      background: var(--green);
      transform: translateY(-3px);
      box-shadow: 0 14px 32px rgba(56, 103, 58, 0.28);
    }
    .btn-outline {
      background: rgba(255, 255, 255, 0.6);
      color: var(--navy);
      border: 1.5px solid rgba(27, 28, 74, 0.2);
    }
    .btn-outline:hover {
      border-color: var(--navy);
      background: var(--white);
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.05);
    }

    /* Right Mascot Column */
    .mascot-col {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    .mascot-glow {
      position: absolute;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(212, 168, 64, 0.28) 0%, rgba(159, 194, 140, 0.22) 50%, transparent 70%);
      border-radius: 50%;
      z-index: 1;
      animation: pulseGlow 4s ease-in-out infinite alternate;
    }
    .mascot-img {
      width: 100%;
      max-width: 340px;
      height: auto;
      object-fit: contain;
      position: relative;
      z-index: 2;
      animation: floatMascot 4.5s ease-in-out infinite;
      filter: drop-shadow(0 18px 30px rgba(27, 28, 74, 0.15));
    }

    @keyframes floatMascot {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
      50% {
        transform: translateY(-14px) rotate(1.5deg);
      }
    }

    @keyframes pulseGlow {
      0% { transform: scale(0.92); opacity: 0.7; }
      100% { transform: scale(1.15); opacity: 1; }
    }

    /* Minimal Bottom Copyright */
    .bottom-bar {
      text-align: center;
      padding: 20px;
      font-size: 0.85rem;
      color: var(--gray);
      z-index: 10;
    }

    @media (max-width: 900px) {
      .top-header {
        padding: 20px 24px;
        justify-content: center;
      }
      .error-container {
        grid-template-columns: 1fr;
        padding: 44px 28px;
        gap: 36px;
        text-align: center;
      }
      .content-col {
        text-align: center;
        order: 2;
      }
      .mascot-col {
        order: 1;
      }
      .error-desc {
        margin-left: auto;
        margin-right: auto;
      }
      .btn-group {
        justify-content: center;
      }
      .mascot-img {
        max-width: 250px;
      }
    }
  </style>
</head>
<body>

  <!-- Minimal Brand Header (No Full Menu) -->
  <header class="top-header">
    <a href="index.html" class="brand-logo" aria-label="Vijigishu Home">
      <img src="images/logo-of-vijigishu_2-1.webp" alt="Vijigishu Educational Travel" />
    </a>
  </header>

  <!-- Main Error Section -->
  <main class="error-main">
    <div class="error-container">
      
      <!-- Left Content Column -->
      <div class="content-col">
        <div class="code-404">404</div>
        <h1 class="error-title">Oops! Looks like the <span>Connection is Lost</span></h1>
        <p class="error-desc">We couldn't connect you to the page you were looking for. The link might be broken, outdated, or disconnected.</p>
        
        <div class="btn-group">
          <a href="index.html" class="btn btn-primary">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            Back to Home
          </a>
          <a href="immersion-programs.html" class="btn btn-outline">
            Explore Programs →
          </a>
        </div>
      </div>

      <!-- Right Mascot Column -->
      <div class="mascot-col">
        <div class="mascot-glow"></div>
        <img src="images/404-mascot.png" alt="Lost Connection Lion Mascot" class="mascot-img" />
      </div>

    </div>
  </main>

  <!-- Minimal Footer -->
  <footer class="bottom-bar">
    © <span class="year"></span> Vijigishu Education Pvt. Ltd. All rights reserved.
  </footer>

  <script>
    document.querySelector('.year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
