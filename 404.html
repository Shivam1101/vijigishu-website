<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>404 - Page Not Found – Vijigishu</title>
  <meta name="description" content="The page you are looking for doesn't exist or has been moved. Return to Vijigishu Educational Travel homepage." />
  <link rel="canonical" href="https://vijigishu.co.in/404" />
  
  <link rel="icon" type="image/png" href="images/admin-profile-icon.png" />
  <link rel="shortcut icon" href="images/admin-profile-icon.png" />
  <link rel="apple-touch-icon" href="images/admin-profile-icon.png" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  
  <style>
    :root {
      --navy: #0D0E2E;
      --green: #38673A;
      --sage: #9FC28C;
      --gold: #D4A840;
      --white: #FFFFFF;
      --gray: #5A5B70;
      --light-gray: #94A3B8;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--navy);
      background: radial-gradient(circle at 50% 12%, rgba(159, 194, 140, 0.22) 0%, rgba(248, 250, 249, 0.98) 55%, #F8FAF9 100%);
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    a { text-decoration: none; color: inherit; }

    /* Top Brand Header */
    .top-header {
      width: 100%;
      padding: 32px 24px 0;
      text-align: center;
      flex-shrink: 0;
    }
    .brand-logo img {
      height: 48px;
      width: auto;
      object-fit: contain;
      transition: transform 0.3s var(--ease);
    }
    .brand-logo:hover img {
      transform: scale(1.03);
    }

    /* Main Error Center Content Area */
    .main-center-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
      z-index: 5;
    }

    /* 404 Numeral */
    .code-404 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(4rem, 8vw, 6.5rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -2px;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #0D0E2E 0%, #38673A 55%, #D4A840 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
    }

    /* Main Heading */
    .error-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(1.6rem, 3vw, 2.4rem);
      color: var(--navy);
      margin-bottom: 12px;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .error-title span {
      color: var(--green);
      font-style: italic;
      font-weight: 700;
    }

    /* Subtitle */
    .error-desc {
      color: var(--gray);
      font-size: clamp(1rem, 1.2vw, 1.15rem);
      line-height: 1.6;
      margin: 0 auto 24px;
      max-width: 600px;
      font-weight: 500;
    }

    /* Premium Action Buttons */
    .btn-group {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 28px;
      border-radius: 100px;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.01em;
      transition: all 0.25s var(--ease);
      cursor: pointer;
      border: none;
      font-family: inherit;
    }
    .btn-primary {
      background: var(--navy);
      color: var(--white);
      box-shadow: 0 6px 16px rgba(13, 14, 46, 0.15);
    }
    .btn-primary:hover {
      background: var(--green);
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(56, 103, 58, 0.25);
    }
    .btn-outline {
      background: var(--white);
      color: var(--navy);
      border: 1.5px solid rgba(13, 14, 46, 0.15);
    }
    .btn-outline:hover {
      border-color: var(--navy);
      background: var(--white);
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.06);
    }

    /* Edge-to-Edge Mascot Section */
    .mascot-wide-wrapper {
      width: 100%;
      margin-top: auto;
      text-align: center;
      line-height: 0;
    }
    .mascot-cutout-img {
      width: 100%;
      max-width: 2560px;
      height: auto;
      max-height: 40vh;
      object-fit: contain; /* Prevents top cropping on desktop */
      object-position: center bottom;
      display: inline-block;
    }

    /* Minimal Footer */
    .bottom-bar {
      width: 100%;
      text-align: center;
      padding: 12px 20px 16px;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--light-gray);
      flex-shrink: 0;
    }

    /* ─── STANDARD MOBILE PRACTICES (<= 768px) ─── */
    @media (max-width: 768px) {
      .top-header { padding: 24px 16px 0; }
      .brand-logo img { height: 44px; } /* Larger logo on mobile */
      
      .main-center-wrapper { padding: 32px 16px 16px; }
      
      .code-404 {
        font-size: 4.5rem; /* Massive, legible impact */
        margin-bottom: 8px;
      }
      .error-title {
        font-size: 1.7rem; /* Standard H1 sizing */
        white-space: normal; /* Allow wrapping naturally */
        margin-bottom: 12px;
      }
      .error-desc {
        font-size: 1.05rem; /* Standard readable paragraph */
        line-height: 1.5;
        max-width: 95%;
        margin-bottom: 32px;
      }
      
      /* Stack buttons for easy thumb tapping */
      .btn-group {
        flex-direction: column;
        width: 100%;
        max-width: 320px;
        gap: 12px;
      }
      .btn {
        width: 100%;
        padding: 14px 24px; /* Larger touch targets */
        font-size: 1rem;
      }
      
      /* Mascot optimization for portrait */
      .mascot-cutout-img {
        height: 32vh; /* Specific height ratio */
        min-height: 200px;
        object-fit: cover; /* Trims long side wires, focuses purely on the center lion */
      }
      
      .bottom-bar { font-size: 0.8rem; padding-bottom: 16px; }
    }
  </style>
</head>
<body>

  <header class="top-header">
    <a href="/" class="brand-logo" aria-label="Vijigishu Home">
      <img 
        src="images/logo-of-vijigishu_2-1.webp" 
        onerror="
          if (!this.dataset.tried1) { this.dataset.tried1='1'; this.src='/images/logo-of-vijigishu_2-1.webp'; }
          else if (!this.dataset.tried2) { this.dataset.tried2='1'; this.src='images/logo-of-vijigishu_2-1.png'; }
          else { this.src='https://staging.vijigishu.co.in/wp-content/uploads/2022/08/logo-of-vijigishu_2-1.png'; }
        " 
        alt="Vijigishu Education Private Limited" 
      />
    </a>
  </header>

  <main class="main-center-wrapper">
    <div class="code-404">404</div>
    <h1 class="error-title">
      Oops! Looks like the <span>Connection is Lost</span>
    </h1>
    <p class="error-desc">We couldn't connect you to this page. The link may be broken, outdated, or moved.</p>
    
    <div class="btn-group">
      <a href="/" class="btn btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        Back to Home
      </a>
      <a href="immersion-programs" class="btn btn-outline">
        Explore Programs →
      </a>
    </div>
  </main>

  <div class="mascot-wide-wrapper">
    <img 
      src="images/404-mascot.png" 
      onerror="
        if (!this.dataset.tried1) { this.dataset.tried1='1'; this.src='/images/404-mascot.png'; }
        else if (!this.dataset.tried2) { this.dataset.tried2='1'; this.src='images/404-mascot-wide.png'; }
        else { this.src='/images/404-mascot-wide.png'; }
      " 
      alt="Lost Connection Lion Mascot" 
      class="mascot-cutout-img" 
    />
  </div>

  <footer class="bottom-bar">
    © <span class="year"></span> Vijigishu Education Pvt. Ltd. All rights reserved.
  </footer>

  <script>
    document.querySelector('.year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
