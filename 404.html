<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found – Vijigishu</title>
  <meta name="description" content="The page you are looking for doesn't exist or has been moved. Return to Vijigishu Educational Travel homepage." />
  <link rel="canonical" href="https://vijigishu.co.in/404.html" />
  <link rel="icon" type="image/png" href="images/admin-profile-icon.png" />
  <link rel="shortcut icon" href="images/admin-profile-icon.png" />
  <link rel="apple-touch-icon" href="images/admin-profile-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;0,800;1,700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy:  #1B1C4A;
      --green: #38673A;
      --sage:  #9FC28C;
      --gold:  #D4A840;
      --white: #FFFFFF;
      --off:   #F6F7F2;
      --gray:  #7B7B8F;
      --dark:  #0D0E2E;
      --ease:  cubic-bezier(.25,.46,.45,.94);
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--navy);
      background: var(--off);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    a { text-decoration: none; color: inherit; }
    
    .error-page-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 120px 24px 80px;
      position: relative;
      background: radial-gradient(circle at 50% 30%, rgba(159, 194, 140, 0.22) 0%, transparent 60%),
                  radial-gradient(circle at 10% 80%, rgba(56, 103, 58, 0.08) 0%, transparent 50%),
                  radial-gradient(circle at 90% 20%, rgba(27, 28, 74, 0.06) 0%, transparent 50%),
                  var(--off);
    }

    .error-card {
      max-width: 900px;
      width: 100%;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1.5px solid rgba(255, 255, 255, 0.9);
      border-radius: 32px;
      box-shadow: 0 20px 60px rgba(27, 28, 74, 0.08), inset 0 1px 2px rgba(255, 255, 255, 1);
      padding: 50px 40px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      gap: 40px;
      position: relative;
      z-index: 2;
    }

    /* Mascot Animation */
    .mascot-col {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    .mascot-glow {
      position: absolute;
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, rgba(212, 168, 64, 0.25) 0%, rgba(159, 194, 140, 0.2) 50%, transparent 70%);
      border-radius: 50%;
      z-index: 1;
      animation: pulseGlow 4s ease-in-out infinite alternate;
    }
    .mascot-img {
      width: 100%;
      max-width: 320px;
      height: auto;
      object-fit: contain;
      position: relative;
      z-index: 2;
      animation: floatMascot 4s ease-in-out infinite;
      filter: drop-shadow(0 15px 25px rgba(27, 28, 74, 0.12));
    }

    @keyframes floatMascot {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
      50% {
        transform: translateY(-12px) rotate(1.5deg);
      }
    }

    @keyframes pulseGlow {
      0% { transform: scale(0.9); opacity: 0.7; }
      100% { transform: scale(1.15); opacity: 1; }
    }

    /* Content & 404 Text Animation */
    .content-col {
      text-align: left;
    }
    .badge-tag {
      display: inline-block;
      font-size: .75rem;
      font-weight: 800;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--green);
      background: rgba(56,103,58,.1);
      border-radius: 100px;
      padding: 6px 16px;
      margin-bottom: 14px;
    }
    
    .code-404 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(4.5rem, 8vw, 6.5rem);
      font-weight: 800;
      line-height: 1;
      margin-bottom: 8px;
      letter-spacing: -2px;
      background: linear-gradient(135deg, var(--navy) 0%, var(--green) 50%, var(--gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
      animation: textShimmer 6s ease-in-out infinite;
    }

    @keyframes textShimmer {
      0%, 100% {
        transform: translateY(0) scale(1);
        filter: drop-shadow(0 4px 12px rgba(56, 103, 58, 0.15));
      }
      50% {
        transform: translateY(-4px) scale(1.02);
        filter: drop-shadow(0 8px 20px rgba(212, 168, 64, 0.25));
      }
    }

    .error-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.6rem, 3vw, 2.1rem);
      color: var(--navy);
      margin-bottom: 14px;
      line-height: 1.25;
    }
    .error-title span {
      color: var(--green);
      font-style: italic;
    }

    .error-desc {
      color: var(--gray);
      font-size: 1rem;
      line-height: 1.65;
      margin-bottom: 30px;
    }

    .btn-group {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 28px;
      border-radius: 100px;
      font-weight: 700;
      font-size: .92rem;
      transition: all .3s var(--ease);
      cursor: pointer;
      border: none;
      font-family: inherit;
    }
    .btn-primary {
      background: var(--navy);
      color: var(--white);
      box-shadow: 0 8px 20px rgba(27, 28, 74, 0.15);
    }
    .btn-primary:hover {
      background: var(--green);
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(56, 103, 58, 0.25);
    }
    .btn-outline {
      background: transparent;
      color: var(--navy);
      border: 1.5px solid rgba(27, 28, 74, 0.25);
    }
    .btn-outline:hover {
      border-color: var(--navy);
      background: rgba(27, 28, 74, 0.04);
      transform: translateY(-2px);
    }

    @media (max-width: 768px) {
      .error-page-wrapper {
        padding: 100px 16px 60px;
      }
      .error-card {
        grid-template-columns: 1fr;
        padding: 36px 24px;
        gap: 30px;
        text-align: center;
      }
      .content-col {
        text-align: center;
      }
      .btn-group {
        justify-content: center;
      }
      .mascot-img {
        max-width: 240px;
      }
    }
  </style>
  <link rel="stylesheet" href="css/global-components.css" />
</head>
<body>

<!-- ===== GLOBAL HEADER ===== -->
<header id="global-header"></header>

<!-- ===== 404 MAIN CONTAINER ===== -->
<main class="error-page-wrapper">
  <div class="error-card">
    
    <!-- Mascot Column -->
    <div class="mascot-col">
      <div class="mascot-glow"></div>
      <img src="images/404-mascot.png" alt="Lost Connection Mascot" class="mascot-img" />
    </div>

    <!-- Text & Actions Column -->
    <div class="content-col">
      <div class="badge-tag">Error 404</div>
      <div class="code-404">404</div>
      <h1 class="error-title">Oops! Looks like the <span>Connection is Lost</span></h1>
      <p class="error-desc">We couldn't connect you to the page you were looking for. The link might be broken, outdated, or disconnected.</p>
      
      <div class="btn-group">
        <a href="index.html" class="btn btn-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          Back to Home
        </a>
        <a href="immersion-programs.html" class="btn btn-outline">
          Explore Programs →
        </a>
      </div>
    </div>

  </div>
</main>

<!-- ===== GLOBAL FOOTER ===== -->
<footer id="global-footer"></footer>

<script src="js/global-components.js"></script>

</body>
</html>
