<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found – Vijigishu</title>
  <meta name="description" content="The page you are looking for doesn't exist or has been moved. Return to Vijigishu Educational Travel homepage." />
  <link rel="canonical" href="https://vijigishu.co.in/404.html" />
  <link rel="icon" type="image/png" href="images/admin-profile-icon.png" />
  <link rel="shortcut icon" href="images/admin-profile-icon.png" />
  <link rel="apple-touch-icon" href="images/admin-profile-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;0,800;1,700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy:  #1B1C4A;
      --green: #38673A;
      --sage:  #9FC28C;
      --gold:  #D4A840;
      --white: #FFFFFF;
      --gray:  #6E6E82;
      --light-gray: #9CA3AF;
      --ease:  cubic-bezier(.25,.46,.45,.94);
    }
    html, body {
      min-height: 100vh;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--navy);
      background: radial-gradient(circle at 50% 15%, rgba(159, 194, 140, 0.3) 0%, transparent 45%),
                  radial-gradient(circle at 85% 25%, rgba(212, 168, 64, 0.15) 0%, transparent 40%),
                  radial-gradient(circle at 15% 40%, rgba(56, 103, 58, 0.1) 0%, transparent 45%),
                  #F9FAF8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow-x: hidden;
    }
    a { text-decoration: none; color: inherit; }

    /* Top Centered Brand Logo */
    .top-header {
      width: 100%;
      padding: 40px 24px 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }
    .brand-logo img {
      height: 56px;
      width: auto;
      object-fit: contain;
      transition: transform 0.3s var(--ease);
    }
    .brand-logo:hover img {
      transform: scale(1.04);
    }

    /* Centered Text Section */
    .error-content {
      max-width: 780px;
      width: 100%;
      text-align: center;
      padding: 10px 24px 0;
      z-index: 5;
    }

    .code-404 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(5rem, 9vw, 7.5rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -2px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #2E5C32 0%, #447746 45%, #B89635 85%, #D4A840 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
      animation: float404 4.5s ease-in-out infinite alternate;
    }

    @keyframes float404 {
      0% {
        transform: translateY(0) scale(1);
        filter: drop-shadow(0 4px 12px rgba(56, 103, 58, 0.15));
      }
      100% {
        transform: translateY(-6px) scale(1.02);
        filter: drop-shadow(0 10px 20px rgba(184, 150, 53, 0.25));
      }
    }

    .error-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.2rem, 4.2vw, 3rem);
      color: var(--navy);
      margin-bottom: 14px;
      line-height: 1.18;
      font-weight: 700;
    }
    .error-title span {
      color: var(--green);
      font-style: italic;
      display: block;
    }

    .error-desc {
      color: var(--gray);
      font-size: 1.05rem;
      line-height: 1.65;
      margin: 0 auto 32px;
      max-width: 580px;
      font-weight: 400;
    }

    .btn-group {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 30px;
      border-radius: 100px;
      font-weight: 600;
      font-size: 0.92rem;
      transition: all 0.3s var(--ease);
      cursor: pointer;
      border: none;
      font-family: inherit;
    }
    .btn-primary {
      background: var(--navy);
      color: var(--white);
      box-shadow: 0 10px 25px rgba(27, 28, 74, 0.22);
    }
    .btn-primary:hover {
      background: var(--green);
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(56, 103, 58, 0.3);
    }
    .btn-primary svg {
      opacity: 0.9;
    }
    .btn-outline {
      background: var(--white);
      color: var(--navy);
      border: 1.5px solid rgba(27, 28, 74, 0.12);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
    }
    .btn-outline:hover {
      border-color: var(--navy);
      background: var(--white);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
    }

    /* Wide Fullscreen Mascot Section with Cutout Wires */
    .mascot-wide-wrapper {
      width: 100vw;
      max-width: 100%;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      margin-top: 10px;
      padding: 10px 0 0;
    }

    .mascot-ambient-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 380px;
      height: 260px;
      background: radial-gradient(circle, rgba(212, 168, 64, 0.25) 0%, rgba(159, 194, 140, 0.2) 50%, transparent 70%);
      border-radius: 50%;
      z-index: 1;
      pointer-events: none;
    }

    .mascot-cutout-img {
      width: 100vw;
      max-width: 1920px;
      min-width: 950px;
      height: auto;
      display: block;
      object-fit: contain;
      position: relative;
      z-index: 2;
      filter: drop-shadow(0 15px 30px rgba(27, 28, 74, 0.08));
    }

    /* Minimal Bottom Copyright */
    .bottom-bar {
      width: 100%;
      text-align: center;
      padding: 18px 20px 28px;
      font-size: 0.82rem;
      color: var(--light-gray);
      z-index: 10;
    }

    @media (max-width: 768px) {
      .top-header {
        padding: 24px 20px 10px;
      }
      .brand-logo img {
        height: 44px;
      }
      .code-404 {
        font-size: 4.6rem;
      }
      .error-title {
        font-size: 1.9rem;
      }
      .error-desc {
        font-size: 0.95rem;
        margin-bottom: 24px;
      }
      .btn {
        padding: 13px 26px;
        font-size: 0.88rem;
      }
      .mascot-cutout-img {
        min-width: 100%;
        max-width: 100vw;
      }
    }
  </style>
</head>
<body>

  <!-- Top Centered Brand Header -->
  <header class="top-header">
    <a href="index.html" class="brand-logo" aria-label="Vijigishu Home">
      <img src="images/logo-of-vijigishu_2-1.webp" alt="Vijigishu Education Private Limited" />
    </a>
  </header>

  <!-- Centered Content Section -->
  <section class="error-content">
    <div class="code-404">404</div>
    <h1 class="error-title">
      Oops! Looks like the
      <span>Connection is Lost</span>
    </h1>
    <p class="error-desc">We couldn't connect you to the page you were looking for. The link might be broken, outdated, or disconnected.</p>
    
    <div class="btn-group">
      <a href="index.html" class="btn btn-primary">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        Back to Home
      </a>
      <a href="immersion-programs.html" class="btn btn-outline">
        Explore Programs →
      </a>
    </div>
  </section>

  <!-- Fullscreen Edge-to-Edge Cutout Mascot Section -->
  <div class="mascot-wide-wrapper">
    <div class="mascot-ambient-glow"></div>
    <img src="images/404-mascot-cutout.png" alt="Lost Connection Lion Mascot" class="mascot-cutout-img" />
  </div>

  <!-- Minimal Footer -->
  <footer class="bottom-bar">
    © <span class="year"></span> Vijigishu Education Pvt. Ltd. All rights reserved.
  </footer>

  <script>
    document.querySelector('.year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
