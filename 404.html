<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>404 - Page Not Found – Vijigishu</title>
  <meta name="description" content="The page you are looking for doesn't exist or has been moved. Return to Vijigishu Educational Travel homepage." />
  <link rel="canonical" href="https://vijigishu.co.in/404" />
  
  
  
  
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  
  <style>
    :root {
      --navy: #2B5495;
      --green: #2B5495;
      --sage: #9FC28C;
      --gold: #D4A840;
      --white: #FFFFFF;
      --gray: #475569;
      --light-gray: #94A3B8;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      height: 100vh;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow-y: auto; overflow-x: hidden; /* Force absolutely no scroll on desktop */
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--navy);
      background: radial-gradient(circle at 50% 12%, rgba(159, 194, 140, 0.22) 0%, rgba(248, 250, 249, 0.98) 55%, #F8FAF9 100%);
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    a { text-decoration: none; color: inherit; }

    /* Top Brand Header */
    .top-header {
      width: 100%;
      padding: 32px 24px 0;
      text-align: center;
      flex-shrink: 0;
    }
    .brand-logo img {
      height: 46px;
      width: auto;
      object-fit: contain;
      transition: transform 0.3s var(--ease);
    }
    .brand-logo:hover img {
      transform: scale(1.03);
    }

    /* Main Error Center Content Area */
    .main-center-wrapper {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 24px;
      text-align: center;
      z-index: 5;
      min-height: 0;
    }

    /* 404 Numeral */
    .code-404 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(3.5rem, 7vw, 6rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -2px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #2B5495 0%, #0F172A 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
    }

    /* Main Heading */
    .error-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(1.5rem, 2.5vw, 2.2rem);
      color: var(--navy);
      margin-bottom: 12px;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .error-title span {
      color: var(--green);
      font-style: italic;
      font-weight: 700;
    }

    /* Subtitle */
    .error-desc {
      color: var(--gray);
      font-size: clamp(0.95rem, 1.1vw, 1.1rem);
      line-height: 1.5;
      margin: 0 auto 24px;
      max-width: 600px;
      font-weight: 500;
    }

    /* Premium Action Buttons */
    .btn-group {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 26px;
      border-radius: 100px;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.01em;
      transition: all 0.25s var(--ease);
      cursor: pointer;
      border: none;
      font-family: inherit;
    }
    .btn-primary {
      background: var(--navy);
      color: var(--white);
      box-shadow: 0 6px 16px rgba(43, 84, 149, 0.15);
    }
    .btn-primary:hover {
      background: var(--green);
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(56, 103, 58, 0.25);
    }
    .btn-outline {
      background: var(--white);
      color: var(--navy);
      border: 1.5px solid rgba(43, 84, 149, 0.15);
    }
    .btn-outline:hover {
      border-color: var(--navy);
      background: var(--white);
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.06);
    }

    /* Edge-to-Edge Mascot Section via CSS Background */
    .mascot-wide-wrapper {
      width: 100%;
      height: 22vh; max-height: 200px; /* Defines the container height */
      margin-top: auto;
      flex-shrink: 1;
      min-height: 0;
      background-image: url('images/404-mascot.webp');
      background-size: cover;
      background-position: -18px 0;
      background-repeat: no-repeat;
    }

    /* Minimal Footer */
    .bottom-bar {
      width: 100%;
      text-align: center;
      padding: 12px 20px 16px;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--light-gray);
      flex-shrink: 0;
    }

    /* ─── STANDARD MOBILE PRACTICES (<= 768px) ─── */
    @media (max-width: 768px) {
      html, body {
        height: auto;
        min-height: 100vh;
        min-height: 100dvh;
        overflow-y: auto; /* Allow natural scroll only on mobile if screen is tiny */
      }
      
      .top-header { padding: 24px 16px 0; }
      .brand-logo img { height: 44px; } 
      
      .main-center-wrapper { padding: 32px 16px 16px; }
      
      .code-404 { font-size: 4.5rem; margin-bottom: 8px; }
      .error-title { font-size: 1.7rem; white-space: normal; margin-bottom: 12px; }
      .error-desc { font-size: 1.05rem; line-height: 1.5; max-width: 95%; margin-bottom: 32px; }
      
      .btn-group { flex-direction: column; width: 100%; max-width: 320px; gap: 12px; }
      .btn { width: 100%; padding: 14px 24px; font-size: 1rem; }
      
      .mascot-wide-wrapper {
        background-size: cover; /* Trims long side wires, focuses on lion */
        height: 20vh;
        background-position: -146px bottom;
      }
      
      .bottom-bar { font-size: 0.8rem; padding-bottom: 16px; }
    }
  
    @media (max-width: 768px) {
      .page-hero { position: relative; aspect-ratio: 38 / 10; display: flex; align-items: center; overflow-y: auto; overflow-x: hidden; margin-top: 72px; }
    }

    @media (max-width: 768px) {
      .page-hero { aspect-ratio: 16 / 9; height: auto; max-height: none; }
    }

    @keyframes ctaFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
    .cta-404-box img { animation: ctaFloat 6s ease-in-out infinite !important; }
</style>
  
  
  
  <link rel="icon" type="image/png" href="images/admin-profile-icon.png" />
  <link rel="shortcut icon" href="images/admin-profile-icon.png" />
  <link rel="apple-touch-icon" href="images/admin-profile-icon.png" />
</head>
<body>

  <header class="top-header">
    <a href="/" class="brand-logo" aria-label="Vijigishu Home">
      <img 
        src="images/logo-of-vijigishu_2-1.webp" 
        onerror="
          if (!this.dataset.tried1) { this.dataset.tried1='1'; this.src='/images/logo-of-vijigishu_2-1.webp'; }
          else if (!this.dataset.tried2) { this.dataset.tried2='1'; this.src='images/logo-of-vijigishu_2-1.png'; }
          else { this.src='https://staging.vijigishu.co.in/wp-content/uploads/2022/08/logo-of-vijigishu_2-1.png'; }
        " 
        alt="Vijigishu Education Private Limited" 
      />
    </a>
  </header>

  <main class="main-center-wrapper">
    <div class="code-404">404</div>
    <div class="cta-404-box" style="margin: 10px auto 14px; text-align: center;">
      <img src="images/floating-world-cta.webp" alt="Vijigishu 3D Floating World" style="max-width: 320px; width: 100%; height: auto; filter: drop-shadow(0 8px 20px rgba(43,84,149,0.18)); display: block; margin: 0 auto;" />
    </div>
    <h1 class="error-title">
      Oops! Looks like the <span>Connection is Lost</span>
    </h1>
    <p class="error-desc">We couldn't connect you to this page. The link may be broken, outdated, or moved.</p>
    
    <div class="btn-group">
      <a href="/" class="btn btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        Back to Home
      </a>
      <a href="our-programs/index.html" class="btn btn-outline">
        Explore Programs →
      </a>
    </div>
  </main>

  <div class="mascot-wide-wrapper" aria-label="Lost Connection Lion Mascot" role="img"></div>

  <footer class="bottom-bar">
    © <span class="year"></span> Vijigishu Education Pvt. Ltd. All rights reserved.
  </footer>

  <script>
    document.querySelector('.year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
