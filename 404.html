<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found – Vijigishu</title>
  <meta name="description" content="The page you are looking for doesn't exist or has been moved. Return to Vijigishu Educational Travel homepage." />
  <link rel="canonical" href="https://vijigishu.co.in/404" />
  <link rel="icon" type="image/png" href="images/admin-profile-icon.png" />
  <link rel="shortcut icon" href="images/admin-profile-icon.png" />
  <link rel="apple-touch-icon" href="images/admin-profile-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;0,800;1,700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy:  #14153D;
      --green: #2F6335;
      --sage:  #A5C992;
      --gold:  #C99F3B;
      --white: #FFFFFF;
      --gray:  #64748B;
      --light-gray: #94A3B8;
      --ease:  cubic-bezier(.25,.46,.45,.94);
    }
    html, body {
      height: 100vh;
      max-height: 100vh;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--navy);
      background: radial-gradient(circle at 50% 18%, rgba(165, 201, 146, 0.32) 0%, transparent 45%),
                  radial-gradient(circle at 82% 22%, rgba(201, 159, 59, 0.16) 0%, transparent 40%),
                  radial-gradient(circle at 18% 30%, rgba(47, 99, 53, 0.1) 0%, transparent 42%),
                  #F8FAF9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
    }
    a { text-decoration: none; color: inherit; }

    /* Top Brand Logo */
    .top-header {
      width: 100%;
      padding: 32px 24px 0;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
      z-index: 10;
    }
    .brand-logo img {
      height: 52px;
      width: auto;
      object-fit: contain;
      transition: transform 0.3s var(--ease);
    }
    .brand-logo:hover img {
      transform: scale(1.03);
    }

    /* Main Error Center Content */
    .error-content {
      max-width: 740px;
      width: 100%;
      text-align: center;
      padding: 0 24px;
      flex-shrink: 0;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .code-404 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(4.2rem, 6.8vw, 5.8rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -2px;
      margin-top: 8px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #26542B 0%, #3B723F 42%, #BA9435 85%, #CF9F34 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
    }

    .error-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.85rem, 3.2vw, 2.5rem);
      color: var(--navy);
      margin-bottom: 12px;
      line-height: 1.22;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .error-title span {
      color: var(--green);
      font-style: italic;
      display: block;
      font-weight: 700;
    }

    .error-desc {
      color: var(--gray);
      font-size: 1rem;
      line-height: 1.6;
      margin: 0 auto 24px;
      max-width: 580px;
      font-weight: 400;
    }

    /* Action Buttons */
    .btn-group {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 13px 30px;
      border-radius: 100px;
      font-weight: 600;
      font-size: 0.92rem;
      transition: all 0.28s var(--ease);
      cursor: pointer;
      border: none;
      font-family: inherit;
    }
    .btn-primary {
      background: var(--navy);
      color: var(--white);
      box-shadow: 0 10px 24px rgba(20, 21, 61, 0.22);
    }
    .btn-primary:hover {
      background: var(--green);
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(47, 99, 53, 0.32);
    }
    .btn-primary svg {
      opacity: 0.95;
    }
    .btn-outline {
      background: var(--white);
      color: var(--navy);
      border: 1.5px solid rgba(20, 21, 61, 0.12);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.03);
    }
    .btn-outline:hover {
      border-color: var(--navy);
      background: var(--white);
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.07);
    }

    /* Upscaled Mascot Image - Seamless Fullscreen Wires */
    .mascot-wide-wrapper {
      width: 100vw;
      max-width: 100%;
      flex: 1;
      min-height: 0;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      overflow: hidden;
      position: relative;
    }

    .mascot-cutout-img {
      width: 100vw;
      max-width: 1920px;
      height: 100%;
      max-height: 44vh;
      display: block;
      object-fit: cover;
      object-position: center bottom;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
      position: relative;
      z-index: 2;
    }

    /* Minimal Bottom Copyright */
    .bottom-bar {
      width: 100%;
      text-align: center;
      padding: 12px 20px 20px;
      font-size: 0.82rem;
      color: var(--light-gray);
      flex-shrink: 0;
      z-index: 10;
    }

    @media (max-height: 700px) {
      .top-header { padding: 18px 20px 0; }
      .brand-logo img { height: 44px; }
      .code-404 { font-size: 3.4rem; margin-top: 2px; margin-bottom: 4px; }
      .error-title { font-size: 1.55rem; margin-bottom: 8px; }
      .error-desc { font-size: 0.88rem; margin-bottom: 16px; line-height: 1.45; }
      .btn { padding: 10px 24px; font-size: 0.85rem; }
      .mascot-cutout-img { max-height: 38vh; }
      .bottom-bar { padding: 6px 20px 12px; font-size: 0.76rem; }
    }

    @media (max-width: 768px) {
      .top-header { padding: 24px 20px 0; }
      .brand-logo img { height: 42px; }
      .code-404 { font-size: 3.6rem; }
      .error-title { font-size: 1.65rem; }
      .error-desc { font-size: 0.92rem; margin-bottom: 18px; }
      .btn-group { gap: 12px; }
      .btn { padding: 11px 24px; font-size: 0.86rem; }
      .mascot-cutout-img { width: 100%; max-width: 100vw; max-height: 36vh; }
    }
  </style>
</head>
<body>

  <!-- Top Centered Brand Header -->
  <header class="top-header">
    <a href="/" class="brand-logo" aria-label="Vijigishu Home">
      <img src="images/logo-of-vijigishu_2-1.webp" alt="Vijigishu Education Private Limited" />
    </a>
  </header>

  <!-- Centered Content Section -->
  <section class="error-content">
    <div class="code-404">404</div>
    <h1 class="error-title">
      Oops! Looks like the
      <span>Connection is Lost</span>
    </h1>
    <p class="error-desc">We couldn't connect you to the page you were looking for. The link might be broken, outdated, or disconnected.</p>
    
    <div class="btn-group">
      <a href="/" class="btn btn-primary">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        Back to Home
      </a>
      <a href="immersion-programs" class="btn btn-outline">
        Explore Programs →
      </a>
    </div>
  </section>

  <!-- Fullscreen Edge-to-Edge Mascot Section -->
  <div class="mascot-wide-wrapper">
    <img src="images/404-mascot.png" alt="Lost Connection Lion Mascot" class="mascot-cutout-img" />
  </div>

  <!-- Minimal Footer -->
  <footer class="bottom-bar">
    © <span class="year"></span> Vijigishu Education Pvt. Ltd. All rights reserved.
  </footer>

  <script>
    document.querySelector('.year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
