  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  
  
  
  
  
  
  function renderBlogs() {
    const grid = document.getElementById('blogGrid');
    const BLOG_DATA_VERSION = 'v15_prerendered_suite_1787489948491';
    let list = DEFAULT_BLOGS;

    try {
      const storedVersion = localStorage.getItem('vijigishu_blogs_ver');
      const raw = localStorage.getItem('vijigishu_blogs');
      if (storedVersion === BLOG_DATA_VERSION && raw) {
        list = JSON.parse(raw);
      } else {
        localStorage.setItem('vijigishu_blogs', JSON.stringify(DEFAULT_BLOGS));
        localStorage.setItem('vijigishu_blogs_ver', BLOG_DATA_VERSION);
        list = DEFAULT_BLOGS;
      }
    } catch(e) {
      list = DEFAULT_BLOGS;
    }

    let filtered = list.filter(b => {
      const matchCat = currentCategory === 'All' || b.category.toLowerCase().includes(currentCategory.toLowerCase()) || currentCategory.toLowerCase().includes(b.category.toLowerCase());
      const matchSearch = !searchQuery || b.title.toLowerCase().includes(searchQuery) || (b.excerpt && b.excerpt.toLowerCase().includes(searchQuery));
      return matchCat && matchSearch;
    });

    if (!filtered.length) {
      grid.innerHTML = `
        <div class="empty-state">
          <h3>No articles found</h3>
          <p style="color:var(--gray);">Try adjusting your search query or selecting a different category filter.</p>
        </div>
      `;
      return;
    }

    // Automated span assigner (generates balanced 12-col dense layout with zero gaps)
    // Dynamic cycle: [Double (8) + Standard (4)], [Full (12)], [Standard (4) + Standard (4) + Standard (4)], [Standard (4) + Double (8)]
    const spanRhythm = ['card-span-double', 'card-span-standard', 'card-span-full', 'card-span-standard', 'card-span-tall', 'card-span-standard', 'card-span-standard', 'card-span-double'];

    grid.innerHTML = filtered.map((b, idx) => {
      const cardImage = b.image || 'images/blog-single-placeholder.png';
      const spanClass = spanRhythm[idx % spanRhythm.length];

      return `
        <a href="${b.pageUrl || ('blog-single.html?id=' + b.id)}" class="visual-blog-card ${spanClass}" title="${escapeHtml(b.title)}">
          <img src="${cardImage}" alt="${escapeHtml(b.title)}" class="visual-card-bg" loading="lazy" onerror="this.src='images/blog-single-placeholder.png';" />
          <div class="visual-card-overlay"></div>

          <div class="visual-card-top">
            <span class="visual-card-badge">${escapeHtml(b.category || 'Article')}</span>
            <span class="visual-card-time">${escapeHtml(b.readTime || '5 min read')}</span>
          </div>

          <div class="visual-card-bottom">
            <h2 class="visual-card-title">${escapeHtml(b.title)}</h2>
            <div class="visual-card-arrow">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="7" y1="17" x2="17" y2="7"></line>
                <polyline points="7 7 17 7 17 17"></polyline>
              </svg>
            </div>
          </div>
        </a>
      `;
    }).join('');
  }

  function setupEventListeners() {
    const pills = document.querySelectorAll('.pill');
    pills.forEach(pill => {
      pill.addEventListener('click', (e) => {
        pills.forEach(p => p.classList.remove('active'));
        e.target.classList.add('active');
        currentCategory = e.target.getAttribute('data-category');
        renderBlogs();
      });
    });

    const searchInput = document.getElementById('searchInput');
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.trim().toLowerCase();
      renderBlogs();
    });
  }

  document.addEventListener('DOMContentLoaded', () => {
    renderBlogs();
    setupEventListeners();
  });
</script>
