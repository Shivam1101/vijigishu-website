<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog &amp; Insights – Vijigishu Educational Travel</title>
  <meta name="description" content="Read the latest articles, student travel guides, global learning trends, and case studies on educational immersion programs." />
  <link rel="canonical" href="https://vijigishu.co.in/blog" />
  <!-- Open Graph / Facebook / WhatsApp -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Vijigishu Educational Travel" />
  <meta property="og:url" content="https://vijigishu.co.in/blog.html" />
  <meta property="og:title" content="Blog &amp; Insights – Vijigishu Educational Travel" />
  <meta property="og:description" content="Read the latest articles, student travel guides, global learning trends, and case studies on educational immersion programs." />
  <meta property="og:image" content="https://vijigishu.co.in/images/Singapore.webp" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://vijigishu.co.in/blog.html" />
  <meta name="twitter:title" content="Blog &amp; Insights – Vijigishu Educational Travel" />
  <meta name="twitter:description" content="Read the latest articles, student travel guides, global learning trends, and case studies on educational immersion programs." />
  <meta name="twitter:image" content="https://vijigishu.co.in/images/Singapore.webp" />
  <link rel="icon" type="image/png" href="images/admin-profile-icon.png" />
  <link rel="shortcut icon" href="images/admin-profile-icon.png" />
  <link rel="apple-touch-icon" href="images/admin-profile-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  
  <style>
    :root {
      --navy: #0D0E2E;
      --green: #38673A;
      --sage: #9FC28C;
      --gold: #D4A840;
      --off: #F4F5F8;
      --dark: #07081A;
      --white: #FFFFFF;
      --gray: #5A5B70;
      --border: #CBD5E1;
      --ease: cubic-bezier(0.25, 1, 0.5, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--off);
      color: var(--navy);
      line-height: 1.6;
      overflow-x: hidden;
    }
    a { text-decoration: none; color: inherit; }
    img { max-width: 100%; height: auto; display: block; }
    
    .container { max-width: 1240px; margin: 0 auto; padding: 0 24px; }

    /* ─── PAGE HERO BANNER ─── */
    .blog-hero {
      background: linear-gradient(135deg, #0D0E2E 0%, #1B1C4A 60%, #223824 100%);
      color: var(--white);
      padding: 85px 0 75px;
      position: relative;
      overflow: hidden;
      text-align: center;
    }
    .blog-hero::before {
      content: ''; position: absolute; top: -100px; right: -100px; width: 450px; height: 450px;
      border-radius: 50%; background: radial-gradient(circle, rgba(159,194,140,.2) 0%, transparent 70%);
      pointer-events: none;
    }
    .blog-hero-content { max-width: 800px; margin: 0 auto; position: relative; z-index: 2; }
    .blog-tag {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2);
      padding: 6px 16px; border-radius: 100px; color: var(--sage); font-size: .8rem; font-weight: 700;
      letter-spacing: .08em; text-transform: uppercase; margin-bottom: 20px;
    }
    .blog-hero-title { font-family: 'Playfair Display', serif; font-size: clamp(2.4rem, 5vw, 3.6rem); line-height: 1.18; margin-bottom: 18px; }
    .blog-hero-title em { color: var(--sage); font-style: italic; }
    .blog-hero-desc { color: rgba(255,255,255,.8); font-size: 1.05rem; line-height: 1.7; max-width: 620px; margin: 0 auto; }

    /* ─── CATEGORY TABS & SEARCH (CLEANLY POSITIONED BELOW HERO) ─── */
    .filter-wrapper {
      margin: 40px auto 44px;
      background: var(--white); border-radius: 20px; padding: 14px 20px;
      box-shadow: 0 10px 35px rgba(13,14,46,0.06);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
      position: relative; z-index: 10;
    }
    .category-pills { display: flex; align-items: center; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
    .category-pills::-webkit-scrollbar { display: none; }
    .pill {
      padding: 8px 18px; border-radius: 100px; font-size: .84rem; font-weight: 600;
      background: var(--off); color: var(--gray); border: 1px solid rgba(0,0,0,0.05); cursor: pointer; transition: all .25s var(--ease); white-space: nowrap;
    }
    .pill:hover, .pill.active { background: var(--navy); color: var(--white); border-color: var(--navy); box-shadow: 0 4px 12px rgba(13,14,46,0.2); }
    
    .search-box {
      display: flex; align-items: center; background: var(--off); border-radius: 100px;
      padding: 6px 14px; border: 1px solid var(--border); flex-grow: 1; max-width: 260px;
    }
    .search-box input { border: none; background: transparent; outline: none; font-size: .85rem; color: var(--navy); width: 100%; padding: 4px 8px; }
    .search-box svg { color: var(--gray); flex-shrink: 0; }

    /* ─── MASONRY / MACHINERY VISUAL BLOG GRID ─── */
    .blog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 28px;
      margin-bottom: 80px;
    }

    /* Visual Image Card */
    .visual-blog-card {
      position: relative;
      height: 380px;
      border-radius: 22px;
      overflow: hidden;
      background: var(--dark);
      box-shadow: 0 10px 30px rgba(13,14,46,0.08);
      border: 1px solid rgba(0,0,0,0.05);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      transition: transform 0.4s var(--ease), box-shadow 0.4s var(--ease);
      text-decoration: none;
    }
    .visual-blog-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 25px 50px rgba(13,14,46,0.18);
    }

    /* Featured Spanned Card on Desktop */
    .visual-blog-card.featured-card {
      grid-column: span 2;
      height: 420px;
    }

    /* Full-bleed Background Image */
    .visual-card-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s var(--ease), filter 0.6s var(--ease);
      z-index: 1;
    }
    .visual-blog-card:hover .visual-card-bg {
      transform: scale(1.07);
    }

    /* Cinematic Gradient Overlay */
    .visual-card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(13,14,46,0.15) 0%, rgba(13,14,46,0.4) 40%, rgba(7,8,26,0.95) 100%);
      z-index: 2;
      transition: background 0.4s var(--ease);
    }
    .visual-blog-card:hover .visual-card-overlay {
      background: linear-gradient(180deg, rgba(13,14,46,0.1) 0%, rgba(13,14,46,0.3) 35%, rgba(7,8,26,0.98) 100%);
    }

    /* Card Top Elements */
    .visual-card-top {
      position: relative;
      z-index: 3;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .visual-card-badge {
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #FFFFFF;
      padding: 5px 14px;
      border-radius: 100px;
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    /* Card Bottom Content (Title + Minimal Arrow Button) */
    .visual-card-bottom {
      position: relative;
      z-index: 3;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
    }
    .visual-card-info { flex: 1; }
    .visual-card-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.32rem;
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1.32;
      margin-bottom: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
      transition: color 0.3s;
    }
    .visual-blog-card.featured-card .visual-card-title {
      font-size: 1.65rem;
      -webkit-line-clamp: 3;
    }
    .visual-blog-card:hover .visual-card-title {
      color: var(--sage);
    }

    .visual-card-meta {
      font-size: 0.78rem;
      color: rgba(255, 255, 255, 0.75);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .visual-card-meta-dot {
      width: 4px; height: 4px;
      background: var(--sage);
      border-radius: 50%;
    }

    /* Minimal Circular Arrow Action Button */
    .visual-card-arrow {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      flex-shrink: 0;
      transition: all 0.3s var(--ease);
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .visual-blog-card:hover .visual-card-arrow {
      background: var(--green);
      border-color: var(--green);
      color: #FFFFFF;
      transform: translate(3px, -3px);
      box-shadow: 0 6px 20px rgba(56,103,58,0.5);
    }

    .empty-state { text-align: center; padding: 70px 20px; grid-column: 1 / -1; }
    .empty-state h3 { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: var(--navy); margin-bottom: 10px; }

    @media (max-width: 900px) {
      .visual-blog-card.featured-card { grid-column: span 1; height: 380px; }
      .blog-grid { grid-template-columns: 1fr; gap: 20px; }
    }
  </style>
  <link rel="stylesheet" href="css/global-components.css?v=1787475903488" />
</head>
<body>

<!-- ===== GLOBAL HEADER ===== -->
<header id="global-header"></header>

<!-- ===== BLOG HERO BANNER ===== -->
<div class="blog-hero">
  <div class="container blog-hero-content">
    <div class="blog-tag">Vijigishu Insights &amp; Stories</div>
    <h1 class="blog-hero-title">Perspectives on <em>Educational Travel</em></h1>
    <p class="blog-hero-desc">Explore expert guides, global learning trends, and industry immersion insights curated for university leaders and students.</p>
  </div>
</div>

<!-- ===== CATEGORY TABS & SEARCH ===== -->
<div class="container">
  <div class="filter-wrapper">
    <div class="category-pills" id="categoryPills">
      <button class="pill active" data-category="All">All Stories</button>
      <button class="pill" data-category="Management">Management</button>
      <button class="pill" data-category="Architecture">Architecture &amp; Design</button>
      <button class="pill" data-category="Engineering">Engineering</button>
      <button class="pill" data-category="School Programs">School Tours</button>
      <button class="pill" data-category="Global Trends">Global Trends</button>
    </div>
    <div class="search-box">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="text" id="searchInput" placeholder="Search blogs..." />
    </div>
  </div>
</div>

<!-- ===== MAIN VISUAL BLOG GRID ===== -->
<main class="container">
  <div class="blog-grid" id="blogGrid">
    <!-- Rendered dynamically -->
  </div>
</main>

<!-- ===== GLOBAL FOOTER ===== -->
<footer id="global-footer"></footer>

<script src="js/global-components.js?v=1787475903488"></script>
<script>
  const DEFAULT_BLOGS = [
    {
      id: "blog-1",
      title: "Why Global Immersion Programs are Essential for Management Students",
      slug: "why-global-immersion-essential-management",
      category: "Management",
      author: "Dr. Vijaya Kumar",
      date: "Aug 18, 2026",
      readTime: "5 min read",
      featured: true,
      image: "images/mangement-2-scaled.webp",
      excerpt: "Discover how firsthand boardroom exposure, kaizen operations visits, and international market tours bridge the gap between classroom MBA theory and real-world business leadership."
    },
    {
      id: "blog-2",
      title: "Observing Scale & Bioclimatic Adaptability: Architecture in Singapore & Japan",
      slug: "observing-scale-bioclimatic-architecture-singapore-japan",
      category: "Architecture",
      author: "Nakul Jadav",
      date: "Aug 12, 2026",
      readTime: "6 min read",
      featured: false,
      image: "images/archi-scaled.webp",
      excerpt: "From Le Corbusier's modernism to Gardens by the Bay's vertical biophilia, explore how architectural study tours redefine spatial storytelling."
    }
  ];

  function getStoredBlogs() {
    const data = localStorage.getItem('vijigishu_blogs');
    if (!data) {
      localStorage.setItem('vijigishu_blogs', JSON.stringify(DEFAULT_BLOGS));
      return DEFAULT_BLOGS;
    }
    try {
      const parsed = JSON.parse(data);
      return (parsed && parsed.length) ? parsed : DEFAULT_BLOGS;
    } catch(e) {
      return DEFAULT_BLOGS;
    }
  }

  let activeCategory = 'All';
  let searchQuery = '';

  function renderBlogs() {
    const blogs = getStoredBlogs();
    const grid = document.getElementById('blogGrid');

    const filtered = blogs.filter(post => {
      const matchCat = (activeCategory === 'All') || (post.category && post.category.toLowerCase() === activeCategory.toLowerCase());
      const matchSearch = !searchQuery || 
        post.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
        (post.excerpt && post.excerpt.toLowerCase().includes(searchQuery.toLowerCase())) ||
        (post.author && post.author.toLowerCase().includes(searchQuery.toLowerCase()));
      return matchCat && matchSearch;
    });

    if (filtered.length === 0) {
      grid.innerHTML = `
        <div class="empty-state">
          <h3>No articles found</h3>
          <p style="color:var(--gray);">Try adjusting your category filter or search query.</p>
        </div>
      `;
      return;
    }

    grid.innerHTML = filtered.map((post, index) => {
      const isFeatured = (index === 0 && filtered.length > 2);
      const postUrl = `blog-single.html?id=${post.id || post.slug}`;
      const fallbackImg = 'images/Singapore.webp';

      return `
        <a href="${postUrl}" class="visual-blog-card ${isFeatured ? 'featured-card' : ''}">
          <!-- Background Image -->
          <img src="${post.image || fallbackImg}" alt="${escapeHtml(post.title)}" class="visual-card-bg" loading="lazy" onerror="this.src='${fallbackImg}';" />
          
          <!-- Cinematic Gradient Overlay -->
          <div class="visual-card-overlay"></div>

          <!-- Top Badge -->
          <div class="visual-card-top">
            <span class="visual-card-badge">${escapeHtml(post.category || 'Insights')}</span>
          </div>

          <!-- Bottom Content: Title + Minimal Arrow -->
          <div class="visual-card-bottom">
            <div class="visual-card-info">
              <h2 class="visual-card-title">${escapeHtml(post.title)}</h2>
              <div class="visual-card-meta">
                <span>${escapeHtml(post.date || 'Aug 2026')}</span>
                <span class="visual-card-meta-dot"></span>
                <span>${escapeHtml(post.readTime || '5 min read')}</span>
              </div>
            </div>
            
            <div class="visual-card-arrow" aria-label="Read article">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="7" y1="17" x2="17" y2="7"></line>
                <polyline points="7 7 17 7 17 17"></polyline>
              </svg>
            </div>
          </div>
        </a>
      `;
    }).join('');
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // Filter Pills Event Binding
  document.getElementById('categoryPills').addEventListener('click', (e) => {
    const btn = e.target.closest('.pill');
    if (!btn) return;
    document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    activeCategory = btn.getAttribute('data-category');
    renderBlogs();
  });

  // Search Input Event Binding
  document.getElementById('searchInput').addEventListener('input', (e) => {
    searchQuery = e.target.value.trim();
    renderBlogs();
  });

  document.addEventListener('DOMContentLoaded', renderBlogs);
</script>
</body>
</html>
