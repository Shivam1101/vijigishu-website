<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog & Insights – Vijigishu Educational Travel</title>
  <meta name="description" content="Read the latest articles, student travel guides, global learning trends, and case studies on educational immersion programs." />
  <link rel="canonical" href="https://vijigishu.co.in/blog.html" />
  <link rel="icon" type="image/png" href="images/admin-profile-icon.png" />
  <link rel="shortcut icon" href="images/admin-profile-icon.png" />
  <link rel="apple-touch-icon" href="images/admin-profile-icon.png" />
  
  
  
  
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  
  <style>
    :root {
      --navy: #0D0E2E;
      --green: #38673A;
      --sage: #9FC28C;
      --gold: #D4A840;
      --off: #F8F9FA;
      --dark: #07081A;
      --white: #FFFFFF;
      --gray: #5A5B70;
      --ease: cubic-bezier(0.25, 1, 0.5, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--off);
      color: var(--navy);
      line-height: 1.6;
      overflow-x: hidden;
    }
    a { text-decoration: none; color: inherit; }
    img { max-width: 100%; height: auto; display: block; }
    
    .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
    
    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 100px;
      font-weight: 700;
      font-size: .9rem;
      transition: all .3s var(--ease);
      cursor: pointer;
      border: none;
    }
    .btn-green { background: var(--sage); color: var(--navy); }
    .btn-green:hover { background: var(--green); color: var(--white); transform: translateY(-2px); }
    .btn-navy { background: var(--navy); color: var(--white); }
    .btn-navy:hover { background: var(--green); transform: translateY(-2px); }

    /* ─── NAVBAR ─── */
    nav {
      position: sticky;
      top: 0; left: 0; right: 0;
      z-index: 999;
      padding: 0 24px;
      background: rgba(255,255,255,.96);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 2px 20px rgba(0,0,0,.05);
    }
    .nav-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 72px;
    }
    .logo-wrap { display: flex; align-items: center; gap: 10px; }
    .logo-icon {
      width: 40px; height: 40px;
      background: var(--navy);
      border-radius: 10px;
      display: grid; place-items: center;
      color: var(--sage); font-weight: 800; font-size: 1.1rem;
    }
    .logo-text { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 800; color: var(--navy); }
    .nav-links { display: flex; align-items: center; gap: 32px; }
    .nav-links a { font-size: .88rem; font-weight: 600; color: var(--gray); transition: color .25s; position: relative; }
    .nav-links a::after {
      content: ''; position: absolute; bottom: -4px; left: 0; width: 0; height: 2px;
      background: var(--green); border-radius: 2px; transition: width .3s var(--ease);
    }
    .nav-links a:hover::after, .nav-links a.active::after { width: 100%; }
    .nav-links a:hover, .nav-links a.active { color: var(--navy); }
    .nav-cta { background: var(--sage); color: var(--navy) !important; padding: 8px 22px; border-radius: 100px; font-weight: 700 !important; }
    .nav-cta:hover { background: var(--green); color: var(--white) !important; }
    .nav-admin-badge {
      background: rgba(13,14,46,.08); color: var(--navy); padding: 6px 14px; border-radius: 20px; font-size: .8rem; font-weight: 700; display: flex; align-items: center; gap: 6px;
    }
    .nav-admin-badge:hover { background: var(--navy); color: var(--sage); }

    .hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; }
    .hamburger span { width: 24px; height: 2px; background: var(--navy); border-radius: 2px; }
    .mobile-menu { display: none; position: fixed; top: 72px; left: 0; right: 0; background: var(--white); padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,.1); flex-direction: column; gap: 16px; z-index: 998; }

    /* ─── PAGE HERO ─── */
    .blog-hero {
      background: linear-gradient(135deg, #0D0E2E 0%, #1B1C4A 60%, #223824 100%);
      color: var(--white);
      padding: 70px 0 90px;
      position: relative;
      overflow: hidden;
    }
    .blog-hero::before {
      content: ''; position: absolute; top: -100px; right: -100px; width: 400px; height: 400px;
      border-radius: 50%; background: radial-gradient(circle, rgba(159,194,140,.18) 0%, transparent 70%);
    }
    .blog-hero-content { max-width: 800px; margin: 0 auto; text-align: center; position: relative; z-index: 2; }
    .blog-tag {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2);
      padding: 6px 16px; border-radius: 100px; color: var(--sage); font-size: .8rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 20px;
    }
    .blog-hero-title { font-family: 'Playfair Display', serif; font-size: clamp(2.5rem, 5vw, 3.8rem); line-height: 1.15; margin-bottom: 20px; }
    .blog-hero-title em { color: var(--sage); font-style: italic; }
    .blog-hero-desc { color: rgba(255,255,255,.75); font-size: 1.1rem; line-height: 1.7; max-width: 620px; margin: 0 auto 36px; }

    /* Search & Filter Bar */
    .filter-wrapper {
      max-width: 900px; margin: -36px auto 48px;
      background: var(--white); border-radius: 24px; padding: 16px 24px;
      box-shadow: 0 15px 40px rgba(0,0,0,.08);
      display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap;
      position: relative; z-index: 10;
    }
    .category-pills { display: flex; align-items: center; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .pill {
      padding: 8px 18px; border-radius: 100px; font-size: .85rem; font-weight: 600;
      background: var(--off); color: var(--gray); border: 1px solid transparent; cursor: pointer; transition: all .25s; white-space: nowrap;
    }
    .pill:hover, .pill.active { background: var(--navy); color: var(--white); }
    
    .search-box { display: flex; align-items: center; background: var(--off); border-radius: 100px; padding: 6px 16px; border: 1px solid rgba(0,0,0,.06); flex-grow: 1; max-width: 280px; }
    .search-box input { border: none; background: transparent; outline: none; font-size: .88rem; color: var(--navy); width: 100%; padding: 6px; }
    .search-box svg { color: var(--gray); flex-shrink: 0; }

    /* ─── FEATURED BLOG CARD ─── */
    .featured-section { margin-bottom: 64px; }
    .featured-card {
      background: var(--white); border-radius: 28px; overflow: hidden;
      display: grid; grid-template-columns: 1.2fr 1fr; gap: 0;
      box-shadow: 0 20px 50px rgba(0,0,0,.06); border: 1px solid rgba(0,0,0,.04);
      transition: transform .3s var(--ease), box-shadow .3s var(--ease);
    }
    .featured-card:hover { transform: translateY(-4px); box-shadow: 0 30px 60px rgba(0,0,0,.1); }
    .featured-img-wrap { position: relative; min-height: 380px; overflow: hidden; }
    .featured-img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s var(--ease); }
    .featured-card:hover .featured-img-wrap img { transform: scale(1.05); }
    .featured-content { padding: 48px; display: flex; flex-direction: column; justify-content: center; }
    .post-badge { display: inline-block; background: rgba(56,103,58,.1); color: var(--green); padding: 4px 12px; border-radius: 100px; font-size: .75rem; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 16px; width: max-content; }
    .featured-title { font-family: 'Playfair Display', serif; font-size: 2rem; color: var(--navy); line-height: 1.25; margin-bottom: 16px; }
    .featured-excerpt { color: var(--gray); font-size: .98rem; line-height: 1.65; margin-bottom: 24px; }
    .post-meta { display: flex; align-items: center; gap: 16px; font-size: .82rem; color: var(--gray); font-weight: 600; }
    .post-meta-dot { width: 4px; height: 4px; background: #C0C0D0; border-radius: 50%; }

    /* ─── BLOG GRID ─── */
    .blog-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; margin-bottom: 72px; }
    .blog-card {
      background: var(--white); border-radius: 20px; overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,.04); border: 1px solid rgba(0,0,0,.04);
      display: flex; flex-direction: column; transition: all .3s var(--ease);
    }
    .blog-card:hover { transform: translateY(-6px); box-shadow: 0 20px 40px rgba(0,0,0,.09); }
    .blog-card-img { position: relative; height: 220px; overflow: hidden; }
    .blog-card-img img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s var(--ease); }
    .blog-card:hover .blog-card-img img { transform: scale(1.06); }
    .blog-card-body { padding: 28px; display: flex; flex-direction: column; flex-grow: 1; }
    .blog-card-title { font-family: 'Playfair Display', serif; font-size: 1.35rem; color: var(--navy); line-height: 1.3; margin-bottom: 12px; font-weight: 700; }
    .blog-card-title a:hover { color: var(--green); }
    .blog-card-excerpt { color: var(--gray); font-size: .9rem; line-height: 1.6; margin-bottom: 20px; flex-grow: 1; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    
    .empty-state { text-align: center; padding: 60px 20px; grid-column: 1 / -1; }
    .empty-state h3 { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: var(--navy); margin-bottom: 12px; }
    
    /* ─── FOOTER ─── */
    footer { background: var(--dark); color: var(--white); padding: 80px 0 32px; }
    
    .footer-grid {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 1.8fr 1.1fr 1.1fr 1.8fr;
      gap: 40px;
      align-items: start;
      margin-bottom: 0;
    }
    .footer-mascot-wrap {
      position: relative;
      display: flex;
      justify-content: flex-end;
      align-items: start;
      margin-bottom: -22px;
      z-index: 3;
    }
    .footer-mascot-img {
      max-height: 280px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 15px 30px rgba(0,0,0,0.5));
      transition: transform 0.3s var(--ease, ease);
    }
    .footer-mascot-img:hover {
      transform: scale(1.04);
    }

    .footer-grid_old { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1.2fr; gap: 48px; margin-bottom: 60px; }
    .footer-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .footer-logo-icon { width: 36px; height: 36px; background: var(--sage); color: var(--navy); border-radius: 8px; display: grid; place-items: center; font-weight: 800; }
    .footer-logo-text { font-family: 'Playfair Display', serif; font-size: 1.2rem; font-weight: 800; color: var(--white); }
    .footer-tagline { color: rgba(255,255,255,.5); font-size: .88rem; line-height: 1.6; max-width: 300px; }
    .footer-col-title { font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: var(--sage); margin-bottom: 20px; }
    .footer-links { display: flex; flex-direction: column; gap: 12px; }
    .footer-links a { color: rgba(255,255,255,.6); font-size: .88rem; transition: color .2s; }
    .footer-links a:hover { color: var(--white); }
    .footer-bottom { border-top: 1px solid rgba(255,255,255,.07); padding-top: 28px; display: flex; justify-content: space-between; align-items: center; color: rgba(255,255,255,.4); font-size: .82rem; }

    @media (max-width: 1024px) {
      .featured-card { grid-template-columns: 1fr; }
      .featured-img-wrap { min-height: 280px; }
      .blog-grid { grid-template-columns: repeat(2, 1fr); }
      .footer-grid { grid-template-columns: 1fr 1fr; gap: 40px; }
    }
    @media (max-width: 768px) {
      .blog-grid { grid-template-columns: 1fr; }
      .nav-links { display: none; }
      .hamburger { display: flex; }
      .featured-content { padding: 32px 24px; }
    }
  </style>
  <link rel="stylesheet" href="css/global-components.css" />
</head>
<body>

<!-- ===== GLOBAL HEADER ===== -->
<header id="global-header"></header>

<!-- ===== BLOG HERO ===== -->
<header class="blog-hero">
  <div class="container blog-hero-content">
    <div class="blog-tag">Vijigishu Insights &amp; Stories</div>
    <h1 class="blog-hero-title">Perspectives on <em>Educational Travel</em></h1>
    <p class="blog-hero-desc">Explore expert guides, student experiences, global leadership trends, and industry insights curated for visionaries.</p>
  </div>
</header>

<!-- ===== FILTER & SEARCH BAR ===== -->
<div class="container">
  <div class="filter-wrapper">
    <div class="category-pills" id="categoryPills">
      <button class="pill active" data-category="All">All Stories</button>
      <button class="pill" data-category="Management">Management</button>
      <button class="pill" data-category="Architecture">Architecture &amp; Design</button>
      <button class="pill" data-category="Engineering">Engineering</button>
      <button class="pill" data-category="School Programs">School Tours</button>
      <button class="pill" data-category="Global Trends">Global Trends</button>
    </div>
    <div class="search-box">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="text" id="searchInput" placeholder="Search blogs..." />
    </div>
  </div>
</div>

<!-- ===== MAIN BLOG CONTENT ===== -->
<main class="container">
  
  <!-- Featured Blog Hero Card -->
  <div class="featured-section" id="featuredSection">
    <!-- Rendered dynamically -->
  </div>

  <!-- Regular Blog Grid -->
  <h3 style="font-family:'Playfair Display',serif; font-size: 1.8rem; margin-bottom: 24px; color: var(--navy);">Latest <em>Articles</em></h3>
  <div class="blog-grid" id="blogGrid">
    <!-- Rendered dynamically -->
  </div>

</main>

<!-- ===== GLOBAL FOOTER ===== -->
<footer id="global-footer"></footer>

<script src="js/global-components.js"></script>
<script>
  // Default Seed Data for Blogs
  const DEFAULT_BLOGS = [
    {
      id: "blog-1",
      title: "Why Global Immersion Programs are Essential for Management Students",
      slug: "why-global-immersion-essential-management",
      category: "Management",
      author: "Dr. Vijaya Kumar",
      date: "Aug 18, 2026",
      readTime: "5 min read",
      featured: true,
      image: "images/mangement-2-scaled.webp",
      excerpt: "Discover how firsthand boardroom exposure, kaizen operations visits, and international market tours bridge the gap between classroom MBA theory and real-world business leadership.",
      blocks: [
        { type: "paragraph", content: "In today’s hyper-connected global economy, textbook business case studies only tell half the story. To truly understand supply chain resilience, luxury brand equity, and ASEAN fintech growth, management students must step directly into global boardrooms." },
        { type: "heading", content: "1. Experiential Exposure in World Financial Hubs" },
        { type: "paragraph", content: "During our Singapore & Europe Management Immersion programs, students engage in closed-door sessions with executive directors at global headquarters such as Boeing Regional HQ, Mercedes-Benz, and the Frankfurt Stock Exchange. Seeing trading floors live and hearing decision-makers analyze risk transforms student perspectives." },
        { type: "quote", content: "Tell me and I forget. Teach me and I remember. Involve me and I learn. — Benjamin Franklin" },
        { type: "heading", content: "2. Developing Cross-Cultural Leadership Intelligence" },
        { type: "paragraph", content: "Navigating international business requires cultural empathy. Interacting with faculties at Paris School of Business and Politecnico di Milano gives young leaders the confidence to negotiate, pitch, and collaborate in multicultural teams." },
        { type: "image", content: "images/Random-1.webp", caption: "Students attending an executive workshop at GISMA Business School, Germany." }
      ]
    },
    {
      id: "blog-2",
      title: "Observing Scale & Bioclimatic Adaptability: Architecture in Singapore & Japan",
      slug: "observing-scale-bioclimatic-architecture-singapore-japan",
      category: "Architecture",
      author: "Nakul Jadav",
      date: "Aug 12, 2026",
      readTime: "6 min read",
      featured: false,
      image: "images/archi-scaled.webp",
      excerpt: "From Le Corbusier's modernism to Gardens by the Bay's vertical biophilia, explore how architectural study tours redefine spatial storytelling.",
      blocks: [
        { type: "paragraph", content: "Architecture is best studied through sight, sound, and touch. Observing structural engineering, materiality, and bioclimatic ventilation in person provides insights no drawing board can replicate." },
        { type: "heading", content: "Biophilic Urbanism in Action" },
        { type: "paragraph", content: "Singapore's transition into a 'City in a Nature' serves as a live laboratory for architecture students. The Supertree Grove and Jewel Changi demonstrate how sustainable engineering can merge seamlessly with civic infrastructure." }
      ]
    },
    {
      id: "blog-3",
      title: "Industry 4.0 & Automation: How Future Engineers Experience Real-World Production",
      slug: "industry-4-automation-future-engineers-production",
      category: "Engineering",
      author: "Amitesh Chakraborty",
      date: "Jul 28, 2026",
      readTime: "4 min read",
      featured: false,
      image: "images/engg-2-scaled.webp",
      excerpt: "Inside state-of-the-art robotic assembly lines and renewable power plants across Germany, Japan, and South Korea.",
      blocks: [
        { type: "paragraph", content: "Engineering comes alive when SCADA systems, industrial robotics, and automated guided vehicles (AGVs) operate in real-time. Our engineering immersion programs connect students directly with chief plant engineers." }
      ]
    },
    {
      id: "blog-4",
      title: "Building Confident Global Citizens: The Impact of K-12 International Edu-Tours",
      slug: "building-confident-global-citizens-k12-edu-tours",
      category: "School Programs",
      author: "Garima Goyal",
      date: "Jul 15, 2026",
      readTime: "4 min read",
      featured: false,
      image: "images/School.webp",
      excerpt: "Early international exposure builds lifelong resilience, global awareness, and independent decision-making skills in young students.",
      blocks: [
        { type: "paragraph", content: "Stepping outside school boundaries transforms how middle and high school students view history, science, and global culture." }
      ]
    }
  ];

  // Fetch blogs from localStorage or initialize with seed data
  function getStoredBlogs() {
    const data = localStorage.getItem('vijigishu_blogs');
    if (!data) {
      localStorage.setItem('vijigishu_blogs', JSON.stringify(DEFAULT_BLOGS));
      return DEFAULT_BLOGS;
    }
    try {
      return JSON.parse(data);
    } catch(e) {
      return DEFAULT_BLOGS;
    }
  }

  let currentCategory = 'All';
  let searchQuery = '';

  function renderBlogs() {
    const blogs = getStoredBlogs();
    const featuredSection = document.getElementById('featuredSection');
    const blogGrid = document.getElementById('blogGrid');

    // Filter logic
    const filtered = blogs.filter(b => {
      const matchCat = currentCategory === 'All' || b.category.toLowerCase() === currentCategory.toLowerCase();
      const matchSearch = b.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                          b.excerpt.toLowerCase().includes(searchQuery.toLowerCase()) ||
                          b.category.toLowerCase().includes(searchQuery.toLowerCase());
      return matchCat && matchSearch;
    });

    if (filtered.length === 0) {
      featuredSection.innerHTML = '';
      blogGrid.innerHTML = `
        <div class="empty-state">
          <h3>No articles found</h3>
          <p style="color:var(--gray);">Try adjusting your category filter or search terms to find relevant stories.</p>
        </div>
      `;
      return;
    }

    // Featured post (first item or marked featured)
    const featured = filtered.find(b => b.featured) || filtered[0];
    const regularPosts = filtered.filter(b => b.id !== featured.id);

    // Render Featured Post
    featuredSection.innerHTML = `
      <div class="featured-card">
        <div class="featured-img-wrap">
          <img src="${featured.image}" alt="${featured.title}" />
        </div>
        <div class="featured-content">
          <span class="post-badge">${featured.category}</span>
          <h2 class="featured-title"><a href="blog-single.html?id=${featured.id}">${featured.title}</a></h2>
          <p class="featured-excerpt">${featured.excerpt}</p>
          <div class="post-meta">
            <span>By ${featured.author}</span>
            <span class="post-meta-dot"></span>
            <span>${featured.date}</span>
            <span class="post-meta-dot"></span>
            <span>${featured.readTime || '5 min read'}</span>
          </div>
          <div style="margin-top: 28px;">
            <a href="blog-single.html?id=${featured.id}" class="btn btn-navy">Read Full Story →</a>
          </div>
        </div>
      </div>
    `;

    // Render Grid Posts
    blogGrid.innerHTML = regularPosts.map(b => `
      <article class="blog-card">
        <div class="blog-card-img">
          <img src="${b.image}" alt="${b.title}" />
        </div>
        <div class="blog-card-body">
          <span class="post-badge" style="margin-bottom: 10px;">${b.category}</span>
          <h4 class="blog-card-title"><a href="blog-single.html?id=${b.id}">${b.title}</a></h4>
          <p class="blog-card-excerpt">${b.excerpt}</p>
          <div class="post-meta" style="margin-top: auto;">
            <span>${b.date}</span>
            <span class="post-meta-dot"></span>
            <span>${b.readTime || '4 min read'}</span>
          </div>
        </div>
      </article>
    `).join('');
  }

  // Event Listeners for Filters & Search
  document.getElementById('categoryPills').addEventListener('click', (e) => {
    if (e.target.classList.contains('pill')) {
      document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
      e.target.classList.add('active');
      currentCategory = e.target.getAttribute('data-category');
      renderBlogs();
    }
  });

  document.getElementById('searchInput').addEventListener('input', (e) => {
    searchQuery = e.target.value;
    renderBlogs();
  });

  // Initial Render
  renderBlogs();
</script>
</body>
</html>
