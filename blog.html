    try {
      const storedVersion = localStorage.getItem('vijigishu_blogs_ver');
      const raw = localStorage.getItem('vijigishu_blogs');
      if (storedVersion === BLOG_DATA_VERSION && raw) {
        list = JSON.parse(raw);
      } else {
        localStorage.setItem('vijigishu_blogs', JSON.stringify(DEFAULT_BLOGS));
        localStorage.setItem('vijigishu_blogs_ver', BLOG_DATA_VERSION);
        list = DEFAULT_BLOGS;
      }
    } catch(e) {
      list = DEFAULT_BLOGS;
    }

    let filtered = list.filter(b => {
      const matchCat = currentCategory === 'All' || b.category.toLowerCase().includes(currentCategory.toLowerCase()) || currentCategory.toLowerCase().includes(b.category.toLowerCase());
      const matchSearch = !searchQuery || b.title.toLowerCase().includes(searchQuery) || (b.excerpt && b.excerpt.toLowerCase().includes(searchQuery));
      return matchCat && matchSearch;
    });

    if (!filtered.length) {
      grid.innerHTML = `
        <div class="empty-state">
          <h3>No articles found</h3>
          <p style="color:var(--gray);">Try adjusting your search query or selecting a different category filter.</p>
        </div>
      `;
      return;
    }

    // 2 -> 1 -> 2 -> 1 Rhythm: [Pair, Pair, SingleWide, Pair, Pair, SingleWide...]
    grid.innerHTML = filtered.map((b, idx) => {
      const isWide = (idx % 3 === 2);
      const cardImage = b.image || 'images/blog-single-placeholder.png';
      const cardClass = isWide ? 'card-single-wide' : 'card-pair';

      return `
        <a href="blog-single.html?id=${b.id}" class="${cardClass}" title="${escapeHtml(b.title)}">
          <div class="card-media-wrap">
            <img src="${cardImage}" alt="${escapeHtml(b.title)}" class="card-media-img" loading="lazy" onerror="this.src='images/blog-single-placeholder.png';" />
            <span class="card-tag-pill">${escapeHtml(b.category || 'Article')}</span>
            <span class="card-read-pill">${escapeHtml(b.readTime || '5 min read')}</span>
          </div>

          <div class="card-content-body">
            <div>
              <div class="card-meta-line">
                <span>${escapeHtml(b.author || 'Vijigishu Team')}</span>
                <span class="card-meta-dot"></span>
                <span>${escapeHtml(b.date || 'Aug 2026')}</span>
              </div>
              <h2 class="card-article-title">${escapeHtml(b.title)}</h2>
              ${b.excerpt ? `<p class="card-article-excerpt">${escapeHtml(b.excerpt)}</p>` : ''}
            </div>

            <div class="card-action-strip">
              <span class="card-action-label">${isWide ? 'Explore Featured Story →' : 'Read Full Article →'}</span>
              <div class="card-action-arrow">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                  <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
              </div>
            </div>
          </div>
        </a>
      `;
    }).join('');
  }

  function setupEventListeners() {
    const pills = document.querySelectorAll('.pill');
    pills.forEach(pill => {
      pill.addEventListener('click', (e) => {
        pills.forEach(p => p.classList.remove('active'));
        e.target.classList.add('active');
        currentCategory = e.target.getAttribute('data-category');
        renderBlogs();
      });
    });

    const searchInput = document.getElementById('searchInput');
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.trim().toLowerCase();
      renderBlogs();
    });
  }

  document.addEventListener('DOMContentLoaded', () => {
    renderBlogs();
    setupEventListeners();
  });
</script>
</body>
</html>
