<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog Details – Vijigishu Educational Travel</title>
  <meta name="description" content="Read our in-depth analysis and student stories from global academic and industrial immersion tours." />
  <link rel="canonical" href="https://vijigishu.co.in/blog-single" />
  <link rel="icon" type="image/png" href="images/admin-profile-icon.png" />
  <link rel="shortcut icon" href="images/admin-profile-icon.png" />
  <link rel="apple-touch-icon" href="images/admin-profile-icon.png" />
  
  
  
  
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  
  <style>
    :root {
      --navy: #0D0E2E;
      --green: #38673A;
      --sage: #9FC28C;
      --gold: #D4A840;
      --off: #F8F9FA;
      --dark: #07081A;
      --white: #FFFFFF;
      --gray: #5A5B70;
      --ease: cubic-bezier(0.25, 1, 0.5, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--white);
      color: var(--navy);
      line-height: 1.7;
      overflow-x: hidden;
    }
    a { text-decoration: none; color: inherit; }
    img { max-width: 100%; height: auto; display: block; }
    
    .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
    .article-container { max-width: 820px; margin: 0 auto; padding: 0 24px; }

    /* ─── NAVBAR ─── */
    nav {
      position: sticky; top: 0; left: 0; right: 0;
      z-index: 999; padding: 0 24px;
      background: rgba(255,255,255,.96);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 2px 20px rgba(0,0,0,.05);
    }
    .nav-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: 72px; }
    .logo-wrap { display: flex; align-items: center; gap: 10px; }
    .logo-icon { width: 40px; height: 40px; background: var(--navy); border-radius: 10px; display: grid; place-items: center; color: var(--sage); font-weight: 800; font-size: 1.1rem; }
    .logo-text { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 800; color: var(--navy); }
    .nav-links { display: flex; align-items: center; gap: 32px; }
    .nav-links a { font-size: .88rem; font-weight: 600; color: var(--gray); transition: color .25s; position: relative; }
    .nav-links a:hover { color: var(--navy); }
    .nav-cta { background: var(--sage); color: var(--navy) !important; padding: 8px 22px; border-radius: 100px; font-weight: 700 !important; }

    .hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; }
    .hamburger span { width: 24px; height: 2px; background: var(--navy); border-radius: 2px; }
    .mobile-menu { display: none; position: fixed; top: 72px; left: 0; right: 0; background: var(--white); padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,.1); flex-direction: column; gap: 16px; z-index: 998; }

    /* ─── ARTICLE HEADER ─── */
    .article-header { padding: 60px 0 40px; text-align: center; }
    .breadcrumb { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: .85rem; color: var(--gray); margin-bottom: 24px; font-weight: 600; }
    .breadcrumb a:hover { color: var(--green); }
    .post-badge { display: inline-block; background: rgba(56,103,58,.1); color: var(--green); padding: 4px 14px; border-radius: 100px; font-size: .78rem; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 20px; }
    .article-title { font-family: 'Playfair Display', serif; font-size: clamp(2.2rem, 4vw, 3.4rem); line-height: 1.2; color: var(--navy); margin-bottom: 24px; }
    
    .author-bar { display: flex; align-items: center; justify-content: center; gap: 16px; font-size: .9rem; color: var(--gray); font-weight: 600; margin-bottom: 40px; }
    .author-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--navy); color: var(--sage); display: grid; place-items: center; font-weight: 800; font-size: 1.1rem; }
    .author-info { text-align: left; }
    .author-name { font-weight: 700; color: var(--navy); }
    .author-meta { font-size: .8rem; color: var(--gray); }

    /* Feature Banner */
    .article-cover { margin-bottom: 56px; border-radius: 28px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,.08); max-height: 480px; }
    .article-cover img { width: 100%; height: 100%; object-fit: cover; }

    /* ─── ARTICLE BODY RENDERING ─── */
    .article-body { font-size: 1.08rem; color: #2D2E45; line-height: 1.8; margin-bottom: 64px; }
    .article-body p { margin-bottom: 28px; }
    .article-body h2, .article-body h3 { font-family: 'Playfair Display', serif; color: var(--navy); margin: 44px 0 20px; line-height: 1.3; }
    .article-body h2 { font-size: 2rem; }
    .article-body h3 { font-size: 1.6rem; }
    
    .article-blockquote {
      margin: 40px 0; padding: 32px 40px; background: var(--off);
      border-left: 4px solid var(--green); border-radius: 0 16px 16px 0;
      font-family: 'Playfair Display', serif; font-size: 1.35rem; font-style: italic; color: var(--navy); line-height: 1.5;
    }
    .article-inline-img { margin: 40px 0; border-radius: 20px; overflow: hidden; }
    .article-inline-img img { width: 100%; border-radius: 20px; }
    .img-caption { text-align: center; font-size: .85rem; color: var(--gray); margin-top: 10px; font-style: italic; }

    .article-callout {
      background: rgba(159,194,140,.15); border: 1px solid rgba(56,103,58,.2);
      border-radius: 20px; padding: 28px; margin: 36px 0; color: var(--navy);
    }
    .article-callout h4 { font-weight: 800; margin-bottom: 8px; color: var(--green); display: flex; align-items: center; gap: 8px; }

    /* Share & Author Card */
    .article-footer { border-top: 1px solid rgba(0,0,0,.08); padding-top: 40px; margin-bottom: 80px; }
    .share-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 40px; flex-wrap: wrap; gap: 16px; }
    .share-title { font-weight: 700; font-size: .9rem; color: var(--navy); }
    .share-btns { display: flex; gap: 10px; }
    .share-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--off); display: grid; place-items: center; color: var(--navy); transition: all .2s; cursor: pointer; border: none; }
    .share-btn:hover { background: var(--navy); color: var(--sage); }

    .author-card {
      background: var(--off); border-radius: 24px; padding: 32px;
      display: flex; align-items: center; gap: 24px;
    }
    .author-card-avatar { width: 70px; height: 70px; border-radius: 50%; background: var(--navy); color: var(--sage); display: grid; place-items: center; font-weight: 800; font-size: 1.8rem; flex-shrink: 0; }
    .author-card-text h4 { font-size: 1.1rem; font-weight: 800; color: var(--navy); margin-bottom: 4px; }
    .author-card-text p { font-size: .88rem; color: var(--gray); line-height: 1.5; margin: 0; }

    /* Related Articles */
    .related-section { background: var(--off); padding: 60px 0; }
    .related-title { font-family: 'Playfair Display', serif; font-size: 2rem; color: var(--navy); margin-bottom: 32px; text-align: center; }
    .related-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }
    .related-card { background: var(--white); border-radius: 16px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,.03); transition: transform .3s; }
    .related-card:hover { transform: translateY(-4px); }
    .related-card img { height: 180px; width: 100%; object-fit: cover; }
    .related-card-body { padding: 20px; }
    .related-card-title { font-family: 'Playfair Display', serif; font-size: 1.1rem; font-weight: 700; color: var(--navy); margin-top: 6px; line-height: 1.3; }

    /* ─── FOOTER ─── */
    footer { background: var(--dark); color: var(--white); padding: 60px 0 32px; }
    
    .footer-grid {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 1.8fr 1.1fr 1.1fr 1.8fr;
      gap: 40px;
      align-items: start;
      margin-bottom: 0;
    }
    .footer-mascot-wrap {
      position: relative;
      display: flex;
      justify-content: flex-end;
      align-items: start;
      margin-bottom: -22px;
      z-index: 3;
    }
    .footer-mascot-img {
      max-height: 280px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 15px 30px rgba(0,0,0,0.5));
      transition: transform 0.3s var(--ease, ease);
    }
    .footer-mascot-img:hover {
      transform: scale(1.04);
    }

    .footer-grid_old { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1.2fr; gap: 48px; margin-bottom: 60px; }
    .footer-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .footer-logo-icon { width: 36px; height: 36px; background: var(--sage); color: var(--navy); border-radius: 8px; display: grid; place-items: center; font-weight: 800; }
    .footer-logo-text { font-family: 'Playfair Display', serif; font-size: 1.2rem; font-weight: 800; color: var(--white); }
    .footer-tagline { color: rgba(255,255,255,.5); font-size: .88rem; line-height: 1.6; max-width: 300px; }
    .footer-col-title { font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: var(--sage); margin-bottom: 20px; }
    .footer-links { display: flex; flex-direction: column; gap: 12px; }
    .footer-links a { color: rgba(255,255,255,.6); font-size: .88rem; transition: color .2s; }
    .footer-links a:hover { color: var(--white); }
    .footer-bottom { border-top: 1px solid rgba(255,255,255,.07); padding-top: 28px; display: flex; justify-content: space-between; align-items: center; color: rgba(255,255,255,.4); font-size: .82rem; }

    @media (max-width: 768px) {
      .related-grid { grid-template-columns: 1fr; }
      .nav-links { display: none; }
      .hamburger { display: flex; }
      .author-card { flex-direction: column; text-align: center; }
      .footer-grid { grid-template-columns: 1fr; }
    }
  </style>
  <link rel="stylesheet" href="css/global-components.css?v=1787413519432" />
</head>
<body>

<!-- ===== GLOBAL HEADER ===== -->
<header id="global-header"></header>

<!-- ===== MAIN ARTICLE HOLDER ===== -->
<main id="articleContent">
  <!-- Dynamically injected -->
</main>

<!-- ===== RELATED ARTICLES ===== -->
<section class="related-section">
  <div class="container">
    <h3 class="related-title">More <em>Stories</em> to Explore</h3>
    <div class="related-grid" id="relatedGrid">
      <!-- Dynamically injected -->
    </div>
  </div>
</section>

<!-- ===== GLOBAL FOOTER ===== -->
<footer id="global-footer"></footer>

<script src="js/global-components.js?v=1787413519432"></script>
<script>

  // Get URL Param
  const urlParams = new URLSearchParams(window.location.search);
  const postId = urlParams.get('id') || urlParams.get('slug');

  // Load from localStorage
  function getBlogs() {
    const data = localStorage.getItem('vijigishu_blogs');
    if (data) {
      try { return JSON.parse(data); } catch(e) {}
    }
    return [];
  }

  function renderArticle() {
    const blogs = getBlogs();
    const articleContainer = document.getElementById('articleContent');

    // Find post by ID or slug
    const post = blogs.find(b => b.id === postId || b.slug === postId) || blogs[0];

    if (!post) {
      articleContainer.innerHTML = `
        <div class="container" style="padding: 100px 20px; text-align: center;">
          <h2 style="font-family:'Playfair Display',serif; font-size: 2.4rem;">Article Not Found</h2>
          <p style="color:var(--gray); margin-top: 12px;">The blog article you are looking for does not exist or has been removed.</p>
          <a href="blog" style="display:inline-block; margin-top: 24px; background:var(--navy); color:var(--white); padding: 12px 28px; border-radius: 100px; font-weight:700;">← Back to Blogs</a>
        </div>
      `;
      return;
    }

    // Update document title
    document.title = `${post.title} – Vijigishu Blogs`;

    // Render Blocks HTML
    const blocksHtml = (post.blocks || []).map(b => {
      if (b.type === 'heading') return `<h2>${b.content}</h2>`;
      if (b.type === 'paragraph') return `<p>${b.content}</p>`;
      if (b.type === 'quote') return `<div class="article-blockquote">${b.content}</div>`;
      if (b.type === 'callout') return `
        <div class="article-callout">
          <h4>💡 Key Takeaway</h4>
          <p>${b.content}</p>
        </div>
      `;
      if (b.type === 'image') return `
        <div class="article-inline-img">
          <img src="${b.content}" alt="Blog Image" />
          ${b.caption ? `<div class="img-caption">${b.caption}</div>` : ''}
        </div>
      `;
      return '';
    }).join('');

    // Author initial
    const authorInit = (post.author || 'V').charAt(0);

    articleContainer.innerHTML = `
      <header class="article-header">
        <div class="article-container">
          <div class="breadcrumb">
            <a href="/">Home</a> <span>›</span>
            <a href="blog">Blogs</a> <span>›</span>
            <span style="color:var(--navy);">${post.category}</span>
          </div>
          <span class="post-badge">${post.category}</span>
          <h1 class="article-title">${post.title}</h1>
          
          <div class="author-bar">
            <div class="author-avatar">${authorInit}</div>
            <div class="author-info">
              <div class="author-name">Written by ${post.author || 'Vijigishu Team'}</div>
              <div class="author-meta">Published on ${post.date} • ${post.readTime || '5 min read'}</div>
            </div>
          </div>
        </div>
      </header>

      <div class="article-container">
        <div class="article-cover">
          <img src="${post.image}" alt="${post.title}" />
        </div>

        <div class="article-body">
          ${blocksHtml || `<p>${post.excerpt}</p>`}
        </div>

        <div class="article-footer">
          <div class="share-bar">
            <div class="share-title">Share this article</div>
            <div class="share-btns">
              <button class="share-btn" onclick="navigator.clipboard.writeText(window.location.href); alert('Link copied to clipboard!');" title="Copy Link">🔗</button>
              <button class="share-btn" onclick="window.open('https://www.linkedin.com/sharing/share-offsite/?url=' + encodeURIComponent(window.location.href))" title="Share on LinkedIn">in</button>
              <button class="share-btn" onclick="window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(document.title) + '&url=' + encodeURIComponent(window.location.href))" title="Share on X">𝕏</button>
            </div>
          </div>

          <div class="author-card">
            <div class="author-card-avatar">${authorInit}</div>
            <div class="author-card-text">
              <h4>${post.author || 'Vijigishu Editorial Team'}</h4>
              <p>Specialists in international academic mobility, industrial immersions, and global experiential learning for Indian institutions.</p>
            </div>
          </div>
        </div>
      </div>
    `;

    // Render Related Articles (exclude current)
    const related = blogs.filter(b => b.id !== post.id).slice(0, 3);
    const relatedGrid = document.getElementById('relatedGrid');
    relatedGrid.innerHTML = related.map(r => `
      <article class="related-card">
        <a href="blog-single.html?id=${r.id}">
          <img src="${r.image}" alt="${r.title}" />
          <div class="related-card-body">
            <span class="post-badge" style="font-size:.7rem; padding: 2px 8px;">${r.category}</span>
            <h4 class="related-card-title">${r.title}</h4>
          </div>
        </a>
      </article>
    `).join('');
  }

  renderArticle();
</script>
</body>
</html>
